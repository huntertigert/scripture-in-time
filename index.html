<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Historical context, a timeline, archaeological finds and maps for all 66 books of the Bible. English and Spanish.">
<meta property="og:title" content="Scripture in Time">
<meta property="og:description" content="Historical context, a timeline, archaeological finds and maps for all 66 books of the Bible. English and Spanish.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f4f2ec">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='6' width='20' height='20' rx='1.5' fill='%23fbfaf6' stroke='%2323408f' stroke-width='1.6'/%3E%3Crect x='3' y='3.5' width='26' height='5' rx='2.5' fill='%2323408f'/%3E%3Crect x='3' y='23.5' width='26' height='5' rx='2.5' fill='%2323408f'/%3E%3C/svg%3E">
<title>Scripture in Time</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif:wght@500;600&family=Noto+Serif+Hebrew:wght@500;600&display=swap">
<style>
/* Layout: sticky top bar, book index on the left, reading column on the right.
   Timeline view is a vertical spine with Bible and Israel events on the left and world history on the right. */
:root{
  --bg:#f4f2ec; --surface:#fbfaf6; --surface2:#e9e6da; --ink:#1b2033; --muted:#585d70; --line:#d6d1c2;
  --accent:#23408f; --accent-ink:#ffffff; --bible:#23408f; --world:#2f6f55; --dig:#a35a00; --rubric:#b3261e; --gold:#b8892b; --ibg:#23408f; --ifg:#f3d98f; --hl:#e6e9f6; --shadow:rgba(27,32,51,.09);
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12141d; --surface:#1b1e2a; --surface2:#262b3b; --ink:#efe9d8; --muted:#a6a293; --line:#353a4c;
    --accent:#8fa6ee; --accent-ink:#12141d; --bible:#8fa6ee; --world:#86c2a0; --dig:#f0b45a; --rubric:#e8857a; --gold:#d9b15a; --ibg:#2b3b7a; --ifg:#f3d98f; --hl:#232c4a; --shadow:rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12141d; --surface:#1b1e2a; --surface2:#262b3b; --ink:#efe9d8; --muted:#a6a293; --line:#353a4c;
  --accent:#8fa6ee; --accent-ink:#12141d; --bible:#8fa6ee; --world:#86c2a0; --dig:#f0b45a; --rubric:#e8857a; --gold:#d9b15a; --ibg:#2b3b7a; --ifg:#f3d98f; --hl:#232c4a; --shadow:rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:56px;display:flex;align-items:center;gap:12px;padding-inline:16px;background:var(--bg);border-bottom:1px solid var(--line)}
.menu{display:none;width:40px;height:40px;border-radius:8px;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface)}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;white-space:nowrap}
.tabs{margin-left:auto;display:flex;gap:4px;background:var(--surface2);padding:3px;border-radius:10px}
.tabs button{padding:6px 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}

.shell{display:grid;grid-template-columns:292px minmax(0,1fr);max-width:1260px;margin:0 auto}
aside{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));height:calc(100vh - 56px);overflow:auto;border-right:1px solid var(--line);padding:14px 12px 48px 16px;min-width:0}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.testament{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
.sec{margin-top:4px}
.sechead{display:flex;align-items:center;gap:8px;width:100%;padding:7px 4px;font-weight:600;font-size:14px;text-align:left}
.sechead .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sechead .car{width:10px;color:var(--muted);transition:transform .15s}
.sec.open .car{transform:rotate(90deg)}
.sw{width:10px;height:10px;border-radius:2px;flex:none}
.books{display:none;flex-direction:column;padding-left:16px;margin-bottom:6px}
.sec.open .books{display:flex}
.bk{display:flex;align-items:center;gap:8px;text-align:left;padding:5px 10px;border-radius:7px;font-size:15px;color:var(--ink)}
.bk small{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.bk:hover{background:var(--surface2)}
.bk[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.bk[aria-current="true"] small{color:var(--accent-ink);opacity:.8}
.noresult{padding:12px 4px;color:var(--muted);font-size:14px}

main{padding:30px 36px 80px;min-width:0}
.scrim{display:none}

.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(38px,6vw,60px);font-weight:700;margin:8px 0 10px}
.lead{font-size:19px;line-height:1.5;max-width:62ch}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;margin:24px 0 0;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.facts div{background:var(--surface);padding:12px 16px;min-width:0}
.facts dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.blocks{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:28px;margin-top:36px}
.blocks h2,.mini h2,.passage h2{font-size:26px;margin-bottom:8px}
.blocks p{max-width:62ch}
.world p{color:var(--muted)}
.events{margin:36px 0 0}
.events h2{font-size:26px;margin-bottom:10px}
.events ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px;counter-reset:ev}
.events li{counter-increment:ev;display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.events li::before{content:counter(ev);flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface2);font-family:var(--f-mono);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:2px}
.passage{margin-top:36px;padding:18px 20px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.passage .ref{font-family:var(--f-display);font-size:28px;font-weight:600}
.passage small{display:block;color:var(--muted);font-size:14px}
.mini{margin-top:40px}
.mini .sub{color:var(--muted);max-width:62ch;margin-bottom:12px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.pager button{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;min-width:0;max-width:100%}
.pager small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pager b{font-family:var(--f-display);font-size:20px}
.note{margin-top:32px;font-size:13.5px;color:var(--muted);max-width:70ch}

/* timeline */
.lanehead{display:grid;grid-template-columns:minmax(0,1fr) 112px minmax(0,1fr);margin-bottom:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.lanehead span:first-child{color:var(--bible);text-align:right;padding-right:14px}
.lanehead span:last-child{color:var(--world);padding-left:14px}
.tl{margin-top:4px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 112px minmax(0,1fr);align-items:start}
.cell{padding:7px 0;min-width:0}
.cell.l{padding-right:14px}.cell.r{padding-left:14px}
.spine{position:relative;display:flex;flex-direction:column;align-items:center;align-self:stretch;padding-top:18px}
.spine::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--line)}
.spine i{position:relative;z-index:1;width:13px;height:13px;border-radius:50%;background:var(--bible);box-shadow:0 0 0 3px var(--bg)}
.row.w .spine i{background:var(--world)}
.spine span{position:relative;z-index:1;margin-top:5px;padding:1px 6px;background:var(--bg);font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;line-height:1.3}
.card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--bible);border-radius:9px;padding:12px 14px;box-shadow:0 1px 2px var(--shadow)}
.card.wld{border-top-color:var(--world)}
.card .when{display:none;font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:2px}
.card h4{font-size:20px;font-weight:600}
.card p{font-size:14.5px;line-height:1.5;color:var(--muted);margin-top:4px}
.card.hl{background:var(--hl);outline:2px solid var(--accent)}
.tag{display:inline-block;margin-top:6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:5px;padding:1px 6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:0 9px;font-size:12px;line-height:20px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.marker{display:grid;grid-template-columns:minmax(0,1fr) 112px minmax(0,1fr);align-items:center;margin:4px 0}
.marker .mk{grid-column:1 / -1;text-align:center;padding:8px 12px;border:1px dashed var(--accent);border-radius:9px;color:var(--accent);font-weight:600;font-size:14px;background:var(--surface)}
.more{display:block;margin:12px auto 0;padding:8px 16px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-weight:600;font-size:14px}
.tlhead h1{font-size:clamp(34px,5vw,52px);font-weight:700}
.tlhead p{max-width:62ch;margin-top:8px;color:var(--muted)}
.ctrl{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin:18px 0 10px}
.seg{display:flex;background:var(--surface2);padding:3px;border-radius:10px}
.seg button{padding:5px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
.erachips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;max-width:100%}
.erachips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:13px;white-space:nowrap}
.erachips button:hover{border-color:var(--accent);color:var(--accent)}
.hlbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 12px;border-radius:9px;background:var(--hl);border:1px solid var(--accent);margin:8px 0;font-size:14px}
.hlbar button{margin-left:auto;font-weight:600;color:var(--accent)}
.era{margin-top:10px}
.eraBar{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:5;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:10px 0 8px;background:var(--bg);border-bottom:2px solid var(--ink);margin-top:28px}
.eraBar h3{font-size:25px;font-weight:700}
.eraBar span{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.erablurb{color:var(--muted);padding:8px 0 4px;max-width:66ch}

/* manuscript refinements */
body{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .3 0 0 0 0 .2 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.brand{display:flex;align-items:center;gap:10px;font-size:26px;letter-spacing:.01em;min-width:0}
.brand span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark{width:30px;height:30px;flex:none}
.pill{color:var(--rubric)}
.card h4{font-size:22px}
.blocks h2,.events h2,.mini h2,.digs h2,.passage h2{font-size:30px}
.hero{padding-bottom:24px;border-bottom:4px double var(--gold)}
.hubhead{padding-bottom:24px;border-bottom:4px double var(--gold)}
.eraBar{border-bottom:3px double var(--gold)}
[lang="he"]{font-family:"Noto Serif Hebrew","Noto Serif",serif}
[lang="el"]{font-family:"Noto Serif",Georgia,serif}
.orig{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;margin:0 0 14px}
.orig span{font-size:28px;line-height:1.3;color:var(--rubric)}
.orig i{font-family:var(--f-mono);font-style:normal;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.initial::first-letter{float:left;font-family:var(--f-display);font-weight:700;font-size:3.3em;line-height:.86;padding:.08em .12em .04em;margin:.07em .12em 0 0;background:var(--ibg);color:var(--ifg);border:2px solid var(--gold)}
.orn{display:flex;align-items:center;gap:14px;margin:40px 0 0;color:var(--gold)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{background:linear-gradient(270deg,transparent,var(--gold))}
.orn i{width:9px;height:9px;transform:rotate(45deg);background:var(--gold);flex:none}
.orn + .events,.orn + .mini{margin-top:24px}

/* archaeology: specimen labels */
.card.dis{border:1px solid var(--gold);border-radius:4px;outline:1px solid var(--line);outline-offset:-5px;padding:16px 18px}
.card.dis.hl{outline:2px solid var(--accent);outline-offset:0}
.dhead{display:flex;gap:12px;align-items:flex-start}
.dhead>div{min-width:0}
.ico{width:38px;height:38px;flex:none;color:var(--accent);stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ico .g{stroke:var(--gold)}
.kick{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rubric)}
.spec{margin:10px 0 0;padding-top:8px;border-top:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:13px}
.spec dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.spec dd{margin:0}
.row.a .spine i{background:var(--dig)}
.card .where{font-family:var(--f-mono);font-size:11.5px;line-height:1.45;color:var(--muted);margin-top:8px}
.src{display:inline-block;margin-top:8px;font-size:13.5px;font-weight:600}
.tag.st-debated,.tag.st-likely{border-style:solid;border-color:var(--dig);color:var(--dig)}
.tag.disc{border-style:solid;border-color:var(--dig);color:var(--dig);margin-right:6px}
.finds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px;align-items:start}
.finds .card .when{display:block}
.digs{margin-top:40px}
.digs h2{font-size:26px;margin-bottom:8px}
.digs .sub{color:var(--muted);max-width:62ch;margin-bottom:12px}
.seg{max-width:100%;overflow-x:auto}
.seg button{white-space:nowrap}
.findhead h1{font-size:clamp(34px,5vw,56px);font-weight:700;margin:8px 0 10px}
.findnote{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--dig);border-radius:9px;background:var(--surface);font-size:14.5px;max-width:78ch}
.findfoot{margin-top:36px;display:flex;flex-wrap:wrap;gap:10px}

/* home hub */
.top.nomenu .menu{display:none!important}
.shell.wide{grid-template-columns:minmax(0,1fr)}
.shell.wide aside{display:none}
.back{display:inline-block;margin-bottom:14px;font-size:14px;font-weight:600;color:var(--accent)}
.back:hover{text-decoration:underline}
.hubhead h1{font-size:clamp(42px,7vw,76px);font-weight:700;margin:8px 0 12px}
.hubctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:22px 0 10px}
.hubleg{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.hubleg button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:1px 11px;font-size:13px}
.hubleg button[aria-pressed="true"]{border-color:var(--accent);background:var(--hl)}
.hubnav{display:flex;gap:6px}
.hubnav button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
.hubnav button:hover{border-color:var(--accent);color:var(--accent)}
.hubscroll{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:100%;scrollbar-width:thin}
.hubin{position:relative}
.hband{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);pointer-events:none}
.hhead{height:46px;padding:5px 10px;background:var(--surface2);overflow:hidden}
.hhead b{display:block;font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.2;white-space:nowrap}
.hhead span{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.hband.gap .hhead{background:transparent;border-bottom:1px dashed var(--line)}
.hband.gap .hhead span{font-style:italic}
.haxis{position:absolute;left:0;right:0;height:2px;background:var(--ink);opacity:.75}
.hstem{position:absolute;width:1px;background:var(--line);z-index:0}
.hdot{position:absolute;width:9px;height:9px;margin:-3.5px 0 0 -4.5px;border-radius:50%;background:var(--c);border:2px solid var(--surface);z-index:2;box-sizing:content-box}
.hchip{position:absolute;z-index:1;height:34px;padding:0 8px 0 10px;text-align:left;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .15s}
.hchip:hover{background:var(--surface2)}
.hchip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-left-color:var(--c)}
.hchip.dim{opacity:.25}
.hlmstem{position:absolute;width:0;border-left:1px dashed var(--accent);opacity:.55;z-index:0}
.hdia{position:absolute;width:9px;height:9px;margin:-3.5px 0 0 -4.5px;transform:rotate(45deg);background:var(--accent);z-index:3}
.hlm{position:absolute;z-index:3;height:20px;padding:0 6px 0 7px;border-left:2px solid var(--accent);background:var(--surface);font-family:var(--f-mono);font-size:11.5px;line-height:20px;white-space:nowrap;color:var(--ink)}
.hubnote{font-size:13.5px;color:var(--muted);margin-top:10px;max-width:72ch}
.hubdetail{margin-top:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:20px 22px;scroll-margin-top:72px}
.hubdetail .hint{color:var(--muted)}
.hd-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px 32px}
.hubdetail h2{font-size:36px;font-weight:700;margin:6px 0 8px}
.hd-ex{max-width:62ch;margin-top:10px}

@media (max-width:860px){

:root[data-theme="dark"]{--sea:#1d2a38;--land:#2e2c25;--coast:#6f6850;--river:#4f7488;--halo:#2e2c25;--r1:#e8857a;--r2:#8fa6ee;--r3:#86c2a0;--paper:#1b1e2a;--pin-edge:#12141d}
.maps{max-width:1180px;margin:0 auto}
.mchips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:18px 0 8px;scrollbar-width:thin}
.mchip{flex:0 0 auto;text-align:left;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;font-weight:600;line-height:1.3}
.mchip small{display:block;font-family:var(--f-mono);font-size:10.5px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mchip[aria-pressed="true"]{border-color:var(--accent);background:var(--hl)}
.mgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px 32px;align-items:start}
.mcol{position:sticky;top:72px;min-width:0}
.mfig{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sea);box-shadow:0 1px 2px var(--shadow)}
.mapsvg{display:block;width:100%;height:auto}
.mreg{fill:var(--muted);opacity:.75;font-family:var(--f-display);font-style:italic;font-weight:600;pointer-events:none}
.mlbl{fill:var(--ink);font-family:var(--f-body);font-weight:600;paint-order:stroke;stroke:var(--halo);stroke-linejoin:round;stroke-opacity:.85;pointer-events:none}
.mlbl.sel{fill:var(--rubric)}.mlbl.fnd{fill:var(--dig)}
.mnum{font-family:var(--f-body);font-weight:700;pointer-events:none}
.mpin{cursor:pointer;outline:none}.mpin.st{pointer-events:none;cursor:default}
.mpin:focus-visible circle:first-child,.mpin:focus-visible path{stroke:var(--gold);stroke-width:2}
.mrt.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:mdraw 1.8s ease-out forwards}
.mrt.fade{opacity:0;animation:mfade .9s ease-out forwards}
@keyframes mdraw{to{stroke-dashoffset:0}}@keyframes mfade{to{opacity:1}}
.mcap{margin-top:10px;min-height:44px}
.mhint,.mnote{font-size:14px;color:var(--muted);margin:0}
.mcard{border:1px solid var(--line);border-left:4px solid var(--rubric);border-radius:9px;background:var(--surface);padding:10px 14px}
.mcard b{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.2}
.mcard p{margin:6px 0 0;font-size:15px}
.mu{font-family:var(--f-mono);font-size:11px;font-style:normal;color:var(--muted);letter-spacing:.03em}
.mbk,.mjump,.mbks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.mbk small,.mjump small,.mbks small{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.mleg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.mleg span{display:inline-flex;align-items:center;gap:6px}
.lp{width:12px;height:12px;border-radius:50%;background:var(--rubric);border:1.5px solid var(--surface);box-shadow:0 0 0 1px var(--rubric);display:inline-block}
.lp.hol{background:var(--surface)}
.ld{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.lf{width:10px;height:10px;background:var(--dig);transform:rotate(45deg);display:inline-block}
.ll{width:22px;height:0;border-top:3px dashed var(--r2);display:inline-block}
.mside h2{font-size:34px;font-weight:700;margin:0}
.msub{color:var(--muted);margin:2px 0 0}
.msteps{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.mstep{display:flex;gap:10px;width:100%;text-align:left;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.mstep:hover{border-color:var(--accent)}
.mstep.on{border-color:var(--accent);background:var(--hl)}
.mn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--rubric);color:var(--paper);font-family:var(--f-body);font-size:13px;font-weight:700}
.mn.unc{background:var(--surface);color:var(--rubric);box-shadow:inset 0 0 0 1.5px var(--rubric)}
.mt{min-width:0}.mt b{font-weight:600}
.md{display:none;font-size:14.5px;color:var(--muted);margin-top:2px}
.mstep.on .md{display:block;color:var(--ink)}
.where{margin-top:36px}.where .sub{color:var(--muted);max-width:62ch;margin-bottom:12px}
.mcb{display:block;font-size:14px;color:var(--muted);margin-top:6px}
.where .mcap{min-height:0;margin-top:10px;padding:10px 14px;border:1px solid var(--line);border-left:4px solid var(--rubric);border-radius:9px;background:var(--surface);font-size:15px}
.where .mcap em{font-family:var(--f-mono);font-size:11px;font-style:normal;color:var(--muted)}.where .mnote{margin-top:8px}
@media (max-width:860px){.mgrid{grid-template-columns:minmax(0,1fr)}.mcol{position:static}}
@media (max-width:560px){.brand span{display:none}.tabs{overflow-x:auto;max-width:calc(100vw - 150px);margin-left:auto}.langs button{padding:6px 6px}.tabs button{padding:6px 8px;white-space:nowrap}}
.langs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:10px;flex:0 0 auto}
.langs button{padding:6px 8px;border-radius:8px;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
.tabs{margin-left:auto}
@media (prefers-reduced-motion:reduce){.mrt.draw,.mrt.fade{animation:none;stroke-dashoffset:0;opacity:1}}

B("Genesis","Law",50,"Traditionally Moses","c. 1445–1405 BC",-1425,-2000,-1800,"Mesopotamia, Canaan, Egypt",
 "The book of beginnings: creation, humanity's fall, and God's covenant promise to Abraham's family.",
 "Abraham's world was a landscape of Sumerian and Amorite city-states, with Egypt already ancient. Neighboring cultures told their own creation and flood stories, many of them polytheistic; Genesis tells the origin of the world with one sovereign Creator. Moses, writing to a people just freed from Egypt, grounds Israel's identity in the promises made to their ancestors.",

 ["Creation and the Fall (chs. 1–3)","The Flood and the tower of Babel (chs. 6–11)","God calls Abraham and makes covenant (chs. 12–17)","Isaac, Jacob and the twelve sons (chs. 21–35)","Joseph rises in Egypt and Israel settles there (chs. 37–50)"],"Genesis 12:1–3"),
B("Exodus","Law",40,"Traditionally Moses","c. 1445–1405 BC",-1425,-1526,-1445,"Egypt, the Red Sea, Mount Sinai",
 "God rescues Israel from slavery, gives the Law at Sinai, and dwells among His people in the tabernacle.",
 "On the early dating, the exodus falls in Egypt's powerful 18th Dynasty (c. 1446 BC); other scholars place it under Ramesses II around 1260 BC. Pharaohs were considered divine, so the plagues confront Egypt's gods directly. The covenant at Sinai follows the shape of ancient treaties between a great king and his vassals.",

 "Egypt still dominant to the west; Canaanite city-states ahead.",
 ["Offerings: burnt, grain, peace, sin and guilt","Aaron and his sons are ordained","Nadab and Abihu die offering unauthorized fire","The Day of Atonement and the annual feasts","The Holiness Code: love your neighbor as yourself"],"Leviticus 19:18"),
B("Numbers","Law",36,"Traditionally Moses","c. 1445–1405 BC",-1410,-1444,-1406,"Sinai, Kadesh, the wilderness, plains of Moab",
 "Israel's forty years in the wilderness: a census, a refusal at Kadesh, and a new generation ready to enter the land.",
 "While Israel wanders, Egypt holds much of Canaan through garrisons and vassal kings. East of the Jordan, Edom, Moab, Ammon and the Amorite kingdoms of Sihon and Og guard the road to the land. The generation that refused to trust God at Kadesh dies out, and the book ends with their children at the Jordan.",
 "Egypt's Canaanite holdings; Edom, Moab, Ammon and the Amorite kingdoms.",
 ["Census and ordering of the camp","Twelve spies; Israel refuses to enter the land","Korah's rebellion","Water from the rock; Moses' sin at Meribah","The bronze serpent and Balaam's oracles"],"Numbers 6:24–26"),
B("Deuteronomy","Law",34,"Traditionally Moses","c. 1406 BC",-1406,-1406,-1406,"Plains of Moab, east of the Jordan",

 "Deuteronomy's structure closely resembles ancient Near Eastern treaties between a great king and his vassals, with a historical prologue, stipulations, blessings and curses. Moses speaks just weeks before his death, with Canaan in sight. Jesus quotes it more than any other Old Testament book when He is tempted in the wilderness.",
 "Egyptian influence waning in Canaan; the city-states ahead remain divided.",
 ["Retelling of the wilderness journey","The Shema and the great commandment","Blessings and curses of the covenant","Moses commissions Joshua","Moses sees the land and dies on Mount Nebo"],"Deuteronomy 6:4–5"),
B("Joshua","History",24,"Traditionally Joshua, with later editing","c. 1400–1350 BC",-1375,-1406,-1375,"Canaan",

B("Judges","History",21,"Unknown (Jewish tradition: Samuel)","c. 1050–1000 BC",-1040,-1375,-1050,"Tribal territories of Israel",

B("1 Chronicles","History",29,"Traditionally Ezra","c. 450–400 BC",-430,-1010,-970,"Jerusalem",

D(-1650,"Avaris: Asiatics in the Nile Delta","Tell el-Dab'a, Egypt","Excavations at Avaris found a large community of Canaanite and other Semitic settlers in Egypt's eastern Delta, some of whom rose to power as the Hyksos. It shows that people from Canaan lived and worked in Egypt in the age of Genesis and Exodus. Whether this connects to Joseph and the Israelites is debated.",["Genesis","Exodus"],BASLIB+"article/does-archaeology-confirm-josephs-time-in-egypt/","debated"),
D(-1350,"The Amarna Letters","Tell el-Amarna, Egypt (found 1887)","Clay tablets from Canaanite rulers, including the king of Jerusalem, write to the pharaoh about threats from raiding groups called the Habiru. They paint a picture of Canaan's city-states in the years around the time of Joshua and Judges.",["Joshua","Judges"],BASLIB+"sidebar/the-amarna-letters-and-the-bible/"),
D(-1406,"Jericho's walls","Tell es-Sultan, Jericho","Excavations by John Garstang and later Kathleen Kenyon uncovered massive fortifications and a burned city. Kenyon dated the destruction to about 1550 BC, far earlier than the biblical date. Other scholars argue for revised dating, so the question remains open.",["Joshua"],BASLIB+"article/did-the-israelites-conquer-jericho-a-new-look-at-the-archaeological-evidence/","debated"),
D(-1208,"The Merneptah Stele","Thebes, Egypt (found 1896); Egyptian Museum, Cairo","A victory hymn of Pharaoh Merneptah lists Israel among the peoples he defeated in Canaan. It is the earliest known mention of Israel outside the Bible and shows Israel was an identifiable people in the land by about 1208 BC.",["Exodus","Joshua","Judges"],BASLIB+"sidebar/the-merneptah-stela-israel-enters-history/"),
D(-1177,"The Philistines on the Medinet Habu reliefs","Temple of Ramesses III, Egypt; digs at Ashkelon, Ekron and Gath","Reliefs show Ramesses III fighting the Sea Peoples, including the Peleset, who are generally identified with the Philistines. Excavations at Philistine cities have found distinct pottery, architecture and customs that fit a people who came from the Aegean world.",["Judges","1 Samuel","2 Samuel"],BAS+"daily/people-cultures-in-the-bible/who-were-philistines-where-did-they-come-from/"),
D(-1000,"Khirbet Qeiyafa","Elah Valley, Israel","A heavily fortified town on the road between Philistia and Jerusalem, dated by its excavators to about 1000 BC, the time of David. They link it to early Judah. Others argue it belonged to a different people or was a cult center, so its meaning is disputed.",["1 Samuel","2 Samuel"],BAS+"daily/biblical-sites-places/biblical-archaeology-sites/khirbet-qeiyafa-and-tel-lachish-excavations-explore-early-kingdom-of-judah/","debated"),
D(-950,"Gates at Hazor, Megiddo and Gezer","Hazor, Megiddo and Gezer, Israel","Matching six-chambered gateways at three cities were linked by Yigael Yadin to 1 Kings 9:15, where Solomon fortifies these towns. Their date and builders are still debated, but they show large-scale royal building in the 900s BC or soon after.",["1 Kings","2 Chronicles"],BAS+"daily/biblical-sites-places/biblical-archaeology-sites/king-solomon-at-gezer/","debated"),
D(-925,"Shishak's list at Karnak","Bubastite Portal, Karnak Temple, Egypt","Pharaoh Shoshenq I (Shishak) carved a list of the towns he captured on a temple wall. It backs up the campaign in 1 Kings 14:25 in the days of Rehoboam, though the surviving list does not name Jerusalem.",["1 Kings","2 Chronicles"],BASLIB+"sidebar/shishaks-military-campaign-in-israel-confirmed/"),
D(-853,"The Kurkh Monolith","Kurkh, Turkey (found 1861); British Museum","Shalmaneser III of Assyria records the battle of Qarqar and lists Ahab the Israelite among his enemies, with 2,000 chariots and 10,000 soldiers. It is one of the earliest records of an Israelite king outside the Bible.",["1 Kings"],BAS+"daily/ancient-cultures/ancient-near-eastern-world/kurkh-monolith-black-obelisk/","","f"),
D(-845,"The Mesha Stele (Moabite Stone)","Dhiban, Jordan (found 1868); Louvre","King Mesha of Moab tells how Israel's king Omri oppressed Moab and how Moab won back its land. It names the LORD (Yahweh) and matches the background of 2 Kings 3.",["2 Kings"],BAS+"daily/biblical-artifacts/inscriptions/what-does-the-mesha-stele-say/"),
D(-841,"The Black Obelisk of Shalmaneser III","Nimrud, Iraq (found 1846); British Museum","A carved panel shows Jehu, called son of Omri (Assyrians used that phrase for Israel's kings), bowing with tribute before the Assyrian king. It is the only known picture of an Israelite king made in his own time.",["2 Kings"],BAS+"daily/ancient-cultures/ancient-near-eastern-world/kurkh-monolith-black-obelisk/","","f"),
D(-840,"The Tel Dan Stele","Tel Dan, northern Israel (found 1993–94); Israel Museum","An Aramaic king boasts of defeating kings of Israel and the house of David. Most scholars read this as the first mention of David's dynasty outside the Bible, though a few question the reading.",["2 Samuel","1 Kings","2 Kings"],BAS+"daily/biblical-artifacts/the-tel-dan-inscription-the-first-historical-evidence-of-the-king-david-bible-story/"),
D(-705,"The Siloam Tunnel inscription","Jerusalem (found 1880); Istanbul Archaeological Museums","Carved inside Hezekiah's Tunnel, a Hebrew inscription describes two teams of workers meeting in the middle as they cut through the rock. It matches the water project in 2 Kings 20:20 and 2 Chronicles 32:30.",["2 Kings","2 Chronicles","Isaiah"],BASLIB+"article/siloam-inscription-memorializes-engineering-achievement/"),
D(-705,"Seal impression of King Hezekiah","Ophel excavations, Jerusalem (announced 2015)","A clay seal impression reads Belonging to Hezekiah, [son of] Ahaz, king of Judah. It was found in debris from the Ophel, just south of the Temple Mount, and is a direct physical record of a biblical king.",["2 Kings","Isaiah","2 Chronicles"],BAS+"daily/news/king-hezekiah-in-the-bible-royal-seal-of-hezekiah-comes-to-light/"),
D(-701,"Sennacherib's Prism and the Lachish reliefs","Nineveh, Iraq; British Museum","Sennacherib's Taylor Prism says he shut Hezekiah up in Jerusalem like a bird in a cage, and palace reliefs show his army taking Lachish. With the Bible, they give accounts of the same campaign from both sides.",["2 Kings","2 Chronicles","Isaiah","Micah"],BAS+"daily/biblical-sites-places/biblical-archaeology-places/sennacheribs-siege-of-lachish/","","f"),
D(-600,"The Ketef Hinnom silver scrolls","Burial cave near Jerusalem (found 1979); Israel Museum","Two tiny silver amulets are inscribed with words matching the priestly blessing of Numbers 6:24–26. They are among the oldest known fragments of biblical text, from about 600 BC.",["Numbers"],BAS+"daily/biblical-artifacts/inscriptions/miniature-writing-ancient-amulets-ketef-hinnom/"),
D(-597,"The Babylonian Chronicle","Babylon; British Museum","A Babylonian record tells how Nebuchadnezzar captured the city of Judah in 597 BC and installed a king of his own choosing. It fits 2 Kings 24, where Jehoiachin is deported and Zedekiah is made king.",["2 Kings","Jeremiah","Ezekiel"],BAS+"daily/ancient-cultures/ancient-near-eastern-world/how-bad-was-the-babylonian-exile/","","f"),
D(-550,"Tablets from a Judean exile village","Babylonia (the Al-Yahudu tablets)","Clay tablets from a village called Judah-town list people with Hebrew names living in Babylonia during and after the exile. They show how exiled Judeans lived, farmed and did business.",["Jeremiah","Ezekiel","Ezra"],BAS+"exhibits-events/tablets-of-jewish-exiles/"),
D(-545,"Nabonidus and Belshazzar","Babylonian texts","Babylonian records show King Nabonidus spent years in Arabia while his son Belshazzar governed in Babylon. That helps explain why Daniel 5 presents Belshazzar as the ruler in the city when it fell.",["Daniel"],BAS+"daily/ancient-cultures/ancient-near-eastern-world/nabonidus-the-first-archaeologist/"),
D(-539,"The Cyrus Cylinder","Babylon (found 1879); British Museum","Cyrus the Great records his capture of Babylon and his policy of returning displaced peoples and their gods to their homelands. It does not name the Jews, but it fits the decree described in Ezra 1.",["Ezra","2 Chronicles","Isaiah","Daniel"],BAS+"daily/ancient-cultures/the-cyrus-cylinder/","","f"),
D(-125,"The Dead Sea Scrolls","Caves near Qumran (found 1947–56); Israel Museum","Hundreds of manuscripts include portions of nearly every Old Testament book, plus the almost complete Great Isaiah Scroll. They are about a thousand years older than the oldest Hebrew manuscripts known before, and they show the text was copied with great care.",["Isaiah","Psalms","Daniel","Deuteronomy"],BAS+"daily/biblical-artifacts/dead-sea-scrolls/what_are_the_dead_sea_scrolls/"),
D(-19,"Herod's Temple Mount","Jerusalem","Herod expanded the Temple platform with enormous retaining walls. The Western Wall and nearby paving stones still stand and show the scale of the Temple complex Jesus knew.",["Matthew","Mark","John"],BASLIB+"article/reconstructing-herods-temple-mount-in-jerusalem/"),
D(-4,"Herod's tomb at Herodium","Herodium, near Bethlehem (found 2007)","Archaeologist Ehud Netzer identified the tomb of Herod the Great in the palace-fortress he built south of Jerusalem. The king of Matthew 2 left monuments across the land.",["Matthew","Luke"],BAS+"daily/bas-onsite/onsite-herodium/","likely"),
D(29,"The Pool of Bethesda","Jerusalem, near the Sheep Gate area","Excavations revealed a large double pool with colonnaded porches, which fits John's description of a pool with five porticoes where Jesus healed a man.",["John"],BAS+"daily/biblical-sites-places/jerusalem/the-bethesda-pool-site-of-one-of-jesus-miracles/"),
D(29,"The Pool of Siloam","Jerusalem (found 2004)","Workers repairing a sewer found stepped pools south of the Temple Mount that match the Pool of Siloam, where Jesus sent a blind man to wash (John 9). Scholars still discuss details of its design and date.",["John"],BAS+"daily/biblical-sites-places/biblical-archaeology-sites/the-siloam-pool-where-jesus-healed-the-blind-man/"),
D(30,"The Caiaphas ossuary","Burial cave in Jerusalem (found 1990)","A decorated bone box inscribed Joseph son of Caiaphas came from an elaborate family tomb. Many scholars think it belonged to the high priest who presided at Jesus' trial, though not all agree.",["Matthew","Luke","John","Acts"],BASLIB+"sidebar/the-tomb-of-caiaphas/","likely"),
D(30,"The crucified man of Giv'at ha-Mivtar","Jerusalem (found 1968)","The heel bone of a man named Yehohanan still held an iron nail, rare skeletal evidence of Roman crucifixion in Judea. It shows how the practice was carried out in Jesus' day.",["Matthew","Mark","John"],BAS+"daily/biblical-topics/crucifixion/a-tomb-in-jerusalem-reveals-the-history-of-crucifixion-and-roman-crucifixion-methods/"),
D(31,"The Pilate Stone","Caesarea Maritima (found 1961); Israel Museum","A limestone block carved with the name of Pontius Pilate as prefect of Judea. It is the best-known inscription naming the governor who condemned Jesus.",["Matthew","Mark","Luke","John"],PEOPLE),
D(51,"The Gallio inscription","Delphi, Greece","A letter of Emperor Claudius carved at Delphi names Gallio as proconsul of Achaia. Because the years of his term can be dated, it helps fix when Paul was in Corinth (Acts 18:12).",["Acts","1 Corinthians","1 Thessalonians"],PEOPLE),
D(54,"The theater at Ephesus","Ephesus, Turkey","The great theater, which held about 24,000 people, is the setting for the riot in Acts 19. Only foundations remain of the temple of Artemis whose silversmiths opposed Paul.",["Acts","Ephesians"],BAS+"daily/biblical-sites-places/biblical-archaeology-places/biblical-riot-at-ephesus/"),
D(57,"The Erastus pavement","Corinth, Greece","A paving stone records that Erastus laid it at his own expense in return for a city office. Some link him to the Erastus who sends greetings in Romans 16:23. The identification is uncertain because the name was common.",["Romans"],BASLIB+"article/corinth-in-pauls-time-what-can-archaeology-tell-us/","debated"),
D(70,"The Arch of Titus","Rome","A relief on the arch shows Roman soldiers carrying the Temple menorah in a triumph after Jerusalem fell in AD 70. It is a Roman record of the destruction Jesus foretold.",["Matthew","Mark","Luke","Hebrews"],BAS+"daily/biblical-sites-places/temple-at-jerusalem/where-did-the-temple-menorah-go/","","f")
];

function iconFor(t){
  if(/Prism|Cylinder/.test(t))return "cylinder";
  if(/Scrolls?\b|silver/.test(t))return "scroll";
  if(/[Ss]eal/.test(t))return "seal";
  if(/ossuary/.test(t))return "box";
  if(/crucified/.test(t))return "nail";
  if(/[Pp]ool/.test(t))return "pool";
  if(/Stele|Stone|Obelisk|inscription|pavement|Monolith/.test(t))return "stele";
  if(/Letters|Chronicle|[Tt]ablets|Nabonidus/.test(t))return "tablet";
  return "wall";
}
function discCard(e){
  var hl=S.hl&&e.bk.indexOf(S.hl)>-1;
  var seg=(e.w||"").split(/;\s*/),last=seg[seg.length-1],rows="";
  if(seg.length>1&&/Museum|Museo|Louvre/.test(last)){rows="<dt>"+T("Found")+"</dt><dd>"+seg.slice(0,-1).join("; ")+"</dd><dt>"+T("Held")+"</dt><dd>"+last+"</dd>";}
  else if(e.w){rows="<dt>"+T("Site")+"</dt><dd>"+e.w+"</dd>";}
  var st=e.n?" · "+T(e.n==="debated"?"Debated":"Likely identification"):"";
  var chips=e.bk.length?'<div class="chips">'+e.bk.map(function(n){return '<button class="chip" data-book="'+n+'">'+dn(n)+"</button>";}).join("")+"</div>":"";
  return '<article class="card dis'+(hl?" hl":"")+'"><div class="when">'+fmt(e)+'</div><div class="dhead"><svg class="ico" viewBox="0 0 32 32" aria-hidden="true">'+ICONS[iconFor(e.o.t)]+'</svg><div><div class="kick">'+T("Discovery")+st+"</div><h4>"+e.t+"</h4></div></div><p>"+e.d+"</p>"
    +'<dl class="spec">'+rows+"</dl>"
    +(e.u?'<a class="src" href="'+e.u+'" target="_blank" rel="noopener">'+T("Read more at BAS")+' &#8599;</a>':"")+chips+"</article>";
}

ca con la que se relacionan. Cada uno enlaza con la Biblical Archaeology Society (en inglés) para ver la historia completa.", "Archaeology can show that people, places and customs in the Bible were real, and it often adds background. It cannot prove every detail, and scholars read some finds differently. Entries marked Debated or Likely identification reflect that disagreement.": "La arqueología puede mostrar que las personas, los lugares y las costumbres de la Biblia fueron reales, y con frecuencia aporta contexto. No puede probar cada detalle, y los eruditos interpretan algunos hallazgos de manera distinta. Las entradas marcadas como Debatido o Identificación probable reflejan ese desacuerdo.", "Biblical Archaeology Society": "Biblical Archaeology Society", "53 people in the Bible confirmed archaeologically": "53 personas de la Biblia confirmadas por la arqueología", "Finds are placed by the date of the event they relate to, not the date they were discovered. Summaries are written for this page, so check the linked articles for the details and for other scholars' views.": "Los hallazgos se ubican según la fecha del evento con el que se relacionan, no según la fecha en que se descubrieron. Los resúmenes se escribieron para esta página; consulte los artículos enlazados para ver los detalles y las opiniones de otros eruditos.", "about 400 years, no new Scripture": "unos 400 años, sin nuevas Escrituras", "Genesis to Revelation": "De Génesis a Apocalipsis", "Sixty-six books across about two thousand years of history. Pick any book on the timeline for a short summary, then continue into its full page.": "Sesenta y seis libros a lo largo de unos dos mil años de historia. Elija cualquier libro en la cronología para ver un breve resumen y luego siga a su página completa.", "Highlight a section": "Resaltar una sección", "Scroll to earlier history": "Desplazar hacia la historia anterior", "Scroll to later history": "Desplazar hacia la historia posterior", "Timeline of the books of the Bible, scrolls sideways": "Cronología de los libros de la Biblia, se desplaza hacia los lados", "Each book sits where its story takes place. The date a book was written is on its own page. Diamonds mark landmark events along the way.": "Cada libro está donde ocurre su historia. La fecha de redacción de un libro aparece en su propia página. Los rombos marcan eventos importantes en el camino.", "Browse archaeological finds": "Explorar los hallazgos arqueológicos", "Select any book on the timeline. Its summary opens here, with a link into the full page for that book.": "Seleccione cualquier libro en la cronología. Su resumen se abre aquí, con un enlace a la página completa de ese libro.", "Continue to the full page": "Continuar a la página completa", "Era": "Época", "Written ": "Escrito", "Setting ": "Escenario", "{n} related find on its page": "{n} hallazgo relacionado en su página", "{n} related finds on its page": "{n} hallazgos relacionados en su página", "Nearby in time": "Cercanos en el tiempo", "Choose a map": "Elegir un mapa", "Follow the journeys of the Bible across the ancient world. Pick a map, then tap a stop to read what happens there.": "Siga los viajes de la Biblia por el mundo antiguo. Elija un mapa y toque una parada para leer lo que sucede allí.", "{t} map": "Mapa: {t}", "Map": "Mapa", "Tap a numbered stop on the map, or a step in the list, to see what happens there.": "Toque una parada numerada en el mapa, o un paso de la lista, para ver lo que sucede allí.", "debated or approximate": "debatido o aproximado", "location debated or approximate": "ubicación debatida o aproximada", "(location debated or approximate)": "(ubicación debatida o aproximada)", "Places like this in": "Lugares como este en", "Stop in order": "Parada, en orden", "Debated or approximate": "Debatido o aproximado", "Other place": "Otro lugar", "Return or later leg": "Regreso o tramo posterior", "Read": "Leer", "Positions are approximate. Many ancient sites are debated, and hollow markers show where scholars disagree or where the Bible gives no exact place. Coastlines are modern; ancient shorelines differ in places such as the Nile Delta and the head of the Persian Gulf. Check a Bible atlas for detail.": "Las posiciones son aproximadas. Muchos sitios antiguos son debatidos, y los marcadores huecos señalan dónde los eruditos discrepan o dónde la Biblia no da un lugar exacto. Las costas son modernas; las costas antiguas eran distintas en lugares como el delta del Nilo y la cabecera del golfo Pérsico. Consulte un atlas bíblico para más detalle.", "Journey maps": "Mapas de viajes", "Where it happens": "Dónde sucede", "Places named in {b}. Tap a marker to see what it is.": "Lugares mencionados en {b}. Toque un marcador para ver qué es.", "Map of places in {b}": "Mapa de los lugares de {b}", "Tap a marker for details.": "Toque un marcador para ver los detalles.", "Place": "Lugar", "Archaeological find": "Hallazgo arqueológico", "{n} find is outside this view. See the finds listed below.": "{n} hallazgo queda fuera de esta vista. Vea los hallazgos listados abajo.", "{n} finds are outside this view. See the finds listed below.": "{n} hallazgos quedan fuera de esta vista. Vea los hallazgos listados abajo.", "Also in: ": "También en: ", "{n} finds": "{n} hallazgos", "{n} archaeological finds here": "{n} hallazgos arqueológicos aquí", "Link": "Enlace"};

var ES={"books":[{"a":"Tradicionalmente Moisés","wl":"c. 1445–1405 a. C.","pl":"Mesopotamia, Canaán, Egipto","sum":"El libro de los comienzos: la creación, la caída de la humanidad y la promesa del pacto de Dios a la familia de Abraham.","ctx":"El mundo de Abraham era un paisaje de ciudades-estado sumerias y amorreas, con un Egipto ya antiguo. Las culturas vecinas contaban sus propias historias de la creación y del diluvio, muchas de ellas politeístas; Génesis narra el origen del mundo con un solo Creador soberano. Moisés, al escribir a un pueblo recién liberado de Egipto, fundamenta la identidad de Israel en las promesas hechas a sus antepasados.","wd":"Las ciudades-estado de Ur, Harán y Babilonia; los Reinos Antiguo y Medio de Egipto; las migraciones amorreas.","ev":["La creación y la caída (caps. 1–3)","El diluvio y la torre de Babel (caps. 6–11)","Dios llama a Abraham y hace un pacto (caps. 12–17)","Isaac, Jacob y los doce hijos (caps. 21–35)","José asciende en Egipto e Israel se establece allí (caps. 37–50)"],"ref":"Génesis 12:1–3"},{"a":"Tradicionalmente Moisés","wl":"c. 1445–1405 a. C.","pl":"Egipto, el Mar Rojo, el monte Sinaí","sum":"Dios rescata a Israel de la esclavitud, da la Ley en el Sinaí y habita entre su pueblo en el tabernáculo.","ctx":"Según la datación temprana, el éxodo ocurre durante la poderosa dinastía XVIII de Egipto (c. 1446 a. C.); otros eruditos lo sitúan bajo Ramsés II, hacia 1260 a. C. Se consideraba divinos a los faraones, así que las plagas confrontan directamente a los dioses de Egipto. El pacto en el Sinaí sigue la forma de los antiguos tratados entre un gran rey y sus vasallos.","wd":"El Reino Nuevo de Egipto (dinastía XVIII), en su apogeo bajo Tutmosis III y Amenhotep II.","ev":["Nace Moisés y es llamado en la zarza ardiente","Las diez plagas y la primera Pascua","El cruce del Mar Rojo","Los Diez Mandamientos en el monte Sinaí","El becerro de oro y la construcción del tabernáculo"],"ref":"Éxodo 19:4–6"},{"a":"Tradicionalmente Moisés","wl":"c. 1445–1405 a. C.","pl":"El monte Sinaí","sum":"Un manual para una vida santa: sacrificios, sacerdocio, pureza y las fiestas que dan forma a la adoración de Israel.","ctx":"Israel acampa en el Sinaí rodeado de culturas cuyos rituales incluían ritos de fertilidad y sacrificio de niños. Levítico presenta un modelo distinto para acercarse a un Dios santo mediante la expiación y una vida apartada. El Día de la Expiación que aparece aquí es el trasfondo del retrato de Cristo como sumo sacerdote en Hebreos.","wd":"Egipto aún dominante al oeste; ciudades-estado cananeas por delante.","ev":["Ofrendas: holocausto, ofrenda de cereal, de paz, por el pecado y por la culpa","Aarón y sus hijos son consagrados","Nadab y Abiú mueren por ofrecer fuego extraño","El Día de la Expiación y las fiestas anuales","El Código de Santidad: ama a tu prójimo como a ti mismo"],"ref":"Levítico 19:18"},{"a":"Tradicionalmente Moisés","wl":"c. 1445–1405 a. C.","pl":"Sinaí, Cades, el desierto, las llanuras de Moab","sum":"Los cuarenta años de Israel en el desierto: un censo, una negativa en Cades y una nueva generación lista para entrar en la tierra.","ctx":"Mientras Israel vaga por el desierto, Egipto controla gran parte de Canaán mediante guarniciones y reyes vasallos. Al este del Jordán, Edom, Moab, Amón y los reinos amorreos de Sehón y Og custodian el camino hacia la tierra. La generación que se negó a confiar en Dios en Cades va muriendo, y el libro termina con sus hijos junto al Jordán.","wd":"Los dominios cananeos de Egipto; Edom, Moab, Amón y los reinos amorreos.","ev":["Censo y ordenamiento del campamento","Los doce espías; Israel se niega a entrar en la tierra","La rebelión de Coré","Agua de la roca; el pecado de Moisés en Meriba","La serpiente de bronce y los oráculos de Balaam"],"ref":"Números 6:24–26"},{"a":"Tradicionalmente Moisés","wl":"c. 1406 a. C.","pl":"Las llanuras de Moab, al este del Jordán","sum":"Los sermones de despedida de Moisés: un llamado a amar y obedecer a Dios mientras Israel renueva el pacto antes de entrar en la tierra.","ctx":"La estructura de Deuteronomio se asemeja mucho a los antiguos tratados del Cercano Oriente entre un gran rey y sus vasallos, con un prólogo histórico, estipulaciones, bendiciones y maldiciones. Moisés habla apenas semanas antes de su muerte, con Canaán a la vista. Jesús lo cita más que a cualquier otro libro del Antiguo Testamento cuando es tentado en el desierto.","wd":"La influencia egipcia disminuye en Canaán; las ciudades-estado que están por delante siguen divididas.","ev":["Repaso del viaje por el desierto","El Shemá y el gran mandamiento","Bendiciones y maldiciones del pacto","Moisés encomienda a Josué","Moisés ve la tierra y muere en el monte Nebo"],"ref":"Deuteronomio 6:4–5"},{"a":"Tradicionalmente Josué, con edición posterior","wl":"c. 1400–1350 a. C.","pl":"Canaán","sum":"Bajo Josué, Israel cruza el Jordán, conquista ciudades clave y recibe la tierra prometida.","ctx":"Canaán en el Bronce Tardío era un mosaico de ciudades-estado fortificadas bajo un control egipcio cada vez más débil; las cartas de Amarna (c. 1350 a. C.) muestran a reyes locales quejándose de invasores llamados habiru. Las campañas de Israel apuntan a Jericó, Hai y fortalezas del sur y del norte. El libro también lidia con el juicio sobre los cananeos y con la fidelidad de Israel.","wd":"Ciudades-estado cananeas bajo un dominio egipcio nominal; el imperio hitita al norte.","ev":["Rahab y el cruce del Jordán","La caída de Jericó","El pecado de Acán y luego la victoria en Hai","El tratado de Gabaón y el día largo","La tierra se reparte por tribus; el pacto se renueva en Siquem"],"ref":"Josué 24:15"},{"a":"Desconocido (tradición judía: Samuel)","wl":"c. 1050–1000 a. C.","pl":"Los territorios tribales de Israel","sum":"Una espiral descendente de pecado, opresión, liberación y pecado otra vez, porque Israel carece de un rey fiel.","ctx":"Tras el colapso de la Edad del Bronce Tardío (c. 1200 a. C.), los viejos imperios se retiran y llegan nuevos pueblos, entre ellos los filisteos en la costa. Israel es una liga tribal poco cohesionada y sin gobierno central. Jueces como Débora, Gedeón y Sansón se levantan para rescates locales, y el estribillo final de que cada uno hacía lo que bien le parecía prepara el camino para la monarquía.","wd":"Egipto se retira de Canaán; filisteos, madianitas, moabitas y amonitas presionan a Israel.","ev":["Otoniel y Aod","Débora y Barac derrotan a Sísara","Gedeón y los 300","El voto de Jefté","Sansón y los filisteos","Guerra civil contra Benjamín"],"ref":"Jueces 21:25"},{"a":"Desconocido (tradición: Samuel)","wl":"c. 1000 a. C.","pl":"Moab y Belén","sum":"La lealtad de una viuda extranjera y la bondad de un pariente redentor traen esperanza en los días oscuros de los jueces.","ctx":"Ambientado en la época en que gobernaban los jueces, Rut muestra una fidelidad sencilla mientras la nación estaba en caos. El hambre lleva a una familia a Moab, y Rut, una moabita, termina en la línea familiar de David y en la ascendencia de Jesús. Las costumbres del rebusco y del pariente redentor provienen de la Ley (Lev. 25; Deut. 25).","wd":"La misma época de Jueces: ningún imperio fuerte en la región; Moab al este del Mar Muerto.","ev":["La familia de Noemí huye del hambre a Moab","Rut promete lealtad a Noemí","El rebusco en el campo de Booz","Booz redime y se casa con Rut","Nace Obed, abuelo de David"],"ref":"Rut 1:16–17"},{"a":"Desconocido (tradición: Samuel, Natán, Gad)","wl":"c. 930–900 a. C.","pl":"Silo, Gabaa, Filistea, Judá","sum":"Israel pasa de los jueces a los reyes: Samuel unge a Saúl y luego a David, mientras el reinado de Saúl se desmorona.","ctx":"Los filisteos, con sus armas de hierro, dominaban la llanura costera y amenazaban la supervivencia de Israel, y capturaron el arca en Afec. La exigencia de Israel de tener un rey imita a las naciones circundantes. Saúl da unidad a las tribus pero es rechazado; David es escogido en Belén.","wd":"Ciudades-estado filisteas; Egipto y Asiria débiles; ciudades fenicias comerciando a lo largo de la costa.","ev":["Nacimiento y llamado de Samuel","El arca es capturada por los filisteos","Saúl es ungido primer rey","David derrota a Goliat","Saúl persigue a David","Saúl muere en el monte Gilboa"],"ref":"1 Samuel 16:7"},{"a":"Desconocido (tradición: Natán, Gad)","wl":"c. 930–900 a. C.","pl":"Hebrón y Jerusalén","sum":"David gobierna Israel, recibe la promesa del pacto de Dios de un trono eterno y sufre las consecuencias de su pecado.","ctx":"Con Egipto, Asiria y los hititas en declive, David construye una potencia regional que se extiende hacia el Éufrates. Conquista Jebús, la convierte en Jerusalén y lleva el arca allí. Los problemas de su familia después de Betsabé y Urías proyectan una sombra sobre la edad de oro.","wd":"Un raro vacío de poder: Egipto en su Tercer Período Intermedio, Asiria débil, los hititas desaparecidos.","ev":["David reina en Hebrón y luego en Jerusalén","El arca es llevada a Jerusalén","El pacto de Dios con David (cap. 7)","Betsabé y Urías; la reprensión de Natán","La rebelión de Absalón"],"ref":"2 Samuel 7:12–16"},{"a":"Desconocido (tradición: Jeremías)","wl":"c. 560–540 a. C.","pl":"Jerusalén y Samaria","sum":"La gloria de Salomón y el Templo, luego un reino dividido y el largo enfrentamiento con la adoración a Baal, encabezado por Elías.","ctx":"Salomón construye con ayuda fenicia de Hiram de Tiro y comercia ampliamente. Tras su muerte en 931, la dureza de Roboam divide el reino, y el faraón Sisac saquea ambas mitades. En el norte, la dinastía de Omri hace de Samaria su capital y Acab se casa con Jezabel de Tiro, importando la adoración a Baal. Los registros asirios mencionan a Acab en Qarqar (853 a. C.).","wd":"La Tiro fenicia; la dinastía XXII de Egipto (Sisac); Aram-Damasco; Asiria comenzando a levantarse.","ev":["La sabiduría, la riqueza y el Templo de Salomón","El reino se divide bajo Roboam y Jeroboam","Los becerros de oro de Jeroboam en Dan y Betel","Acab, Jezabel y la viña de Nabot","Elías en el monte Carmelo"],"ref":"1 Reyes 18:21"},{"a":"Desconocido (tradición: Jeremías)","wl":"c. 560–540 a. C.","pl":"Israel, Judá, Asiria, Babilonia","sum":"De Eliseo al exilio: la caída de Samaria en 722 a. C. y de Jerusalén en 586 a. C.","ctx":"La máquina de guerra de Asiria devora el reino del norte, y la Jerusalén de Ezequías sobrevive al asedio de Senaquerib en 701 a. C., un hecho también registrado en los anales asirios. La reforma de Josías llega demasiado tarde, y Babilonia, en ascenso tras la caída de Nínive, destruye Jerusalén. El libro termina con un rey exiliado a quien se le muestra una pequeña bondad en Babilonia.","wd":"Asiria (de Salmanasar III a Senaquerib), luego Babilonia bajo Nabucodonosor; Necao de Egipto.","ev":["Elías es llevado al cielo; los milagros de Eliseo","La revuelta de Jehú (841 a. C.)","Samaria cae ante Asiria (722 a. C.)","Ezequías y Senaquerib (701 a. C.)","Josías encuentra la Ley y reforma Judá","Jerusalén y el Templo son destruidos (586 a. C.)"],"ref":"2 Reyes 22:8–13"},{"a":"Tradicionalmente Esdras","wl":"c. 450–400 a. C.","pl":"Jerusalén","sum":"Genealogías desde Adán, y luego el reinado de David, contado para una comunidad regresada que reconstruye su identidad.","ctx":"Escrito después del exilio, Crónicas vuelve a contar la historia de Israel para quienes vivían en la pequeña provincia persa de Yehud. Subraya la línea de David, el Templo y la adoración correcta, recordando a los que regresaron que las promesas de Dios siguen en pie. Las largas genealogías muestran que la comunidad tiene raíces en una historia más grande.","wd":"El Imperio persa (Yehud, una pequeña provincia); escrito después del exilio babilónico.","ev":["Genealogías desde Adán hasta los exiliados","Muere Saúl; David es ungido sobre todo Israel","El arca es llevada a Jerusalén","El pacto de Dios con David","David hace preparativos para el Templo"],"ref":"1 Crónicas 29:11"},{"a":"Tradicionalmente Esdras","wl":"c. 450–400 a. C.","pl":"Jerusalén y Judá","sum":"Del Templo de Salomón al decreto de Ciro, centrado en los reyes de Judá y el llamado a buscar a Dios.","ctx":"Crónicas narra la historia de los reyes de Judá con la mirada puesta en el avivamiento: Asa, Josafat, Ezequías y Josías vuelven a Dios y prosperan. Termina con Ciro de Persia liberando a los exiliados para reconstruir el Templo, una invitación abierta a regresar que conduce directamente a Esdras.","wd":"Desde el imperio comercial de Salomón, pasando por Asiria y Babilonia, hasta el Ciro de Persia.","ev":["Salomón construye y dedica el Templo","Roboam y la división","Avivamientos bajo Asa, Josafat, Ezequías y Josías","La caída de Jerusalén","El decreto de Ciro para reconstruir"],"ref":"2 Crónicas 7:14"},{"a":"Tradicionalmente Esdras el escriba","wl":"c. 440–430 a. C.","pl":"Babilonia y Jerusalén","sum":"Los exiliados regresan de Babilonia, reconstruyen el Templo y Esdras restaura al pueblo en la Ley.","ctx":"La política de Ciro de permitir que los pueblos cautivos volvieran a su hogar (véase el Cilindro de Ciro) envía a los judíos de regreso bajo Sesbasar y Zorobabel en 538 a. C. La oposición local detiene la obra hasta que Hageo y Zacarías animan al pueblo, y el Segundo Templo se termina en 516 a. C. Décadas después, Esdras llega bajo Artajerjes I con respaldo real.","wd":"El Imperio persa bajo Ciro, Darío I y Artajerjes I; los pueblos vecinos se oponen a los judíos.","ev":["El decreto de Ciro y el primer regreso (538 a. C.)","Se levantan el altar y los cimientos","La oposición detiene la obra","El Templo es terminado (516 a. C.)","Esdras llega (458 a. C.) y confronta los matrimonios mixtos"],"ref":"Esdras 7:10"},{"a":"Nehemías (memorias, con Esdras)","wl":"c. 430 a. C.","pl":"Susa y Jerusalén","sum":"Un copero del rey reconstruye el muro de Jerusalén en 52 días y renueva el pacto.","ctx":"Nehemías sirve a Artajerjes I, quien lo autoriza a ir. Jerusalén sigue siendo vulnerable, y rivales locales como Sanbalat de Samaria, Tobías y Gesem se oponen a la obra. Después de terminado el muro, Esdras lee la Ley y el pueblo renueva el pacto.","wd":"El Imperio persa bajo Artajerjes I; gobernadores vecinos en Samaria, Amón y Arabia.","ev":["La oración de Nehemías y el permiso del rey","El muro se reconstruye en 52 días a pesar de las amenazas","Esdras lee la Ley; el pueblo celebra","El pacto es renovado","Las reformas de Nehemías"],"ref":"Nehemías 8:1–10"},{"a":"Desconocido (posiblemente Mardoqueo)","wl":"Después de 473 a. C.; fecha exacta desconocida","pl":"Susa, Persia","sum":"Ester, una reina judía de Persia, arriesga su vida para salvar a su pueblo del complot de Amán.","ctx":"Jerjes I (Asuero) gobernó desde la India hasta Cus y ofreció un gran banquete en su tercer año (483 a. C.), probablemente mientras planeaba su invasión de Grecia. Ester llega a ser reina hacia 479 a. C., después de que él regresa derrotado de Salamina y Platea. Dios nunca es nombrado en el libro, y sin embargo su providencia recorre cada giro de los acontecimientos, y Purim todavía se celebra.","wd":"El Imperio persa en su máxima extensión; las guerras greco-persas (Termópilas, Salamina).","ev":["Vasti es depuesta; Ester es hecha reina","Mardoqueo descubre un complot y se niega a inclinarse ante Amán","El decreto de Amán contra los judíos","Ester se presenta ante el rey sin ser invitada","Amán cae; se instituye Purim"],"ref":"Ester 4:14"},{"a":"Desconocido","wl":"Fecha incierta","pl":"La tierra de Uz","sum":"Un hombre justo sufre terriblemente y lucha con Dios por saber por qué.","ctx":"La riqueza de Job en ganado, su papel como sacerdote de la familia y su larga vida se parecen a la era patriarcal, aunque se desconocen la fecha y el autor. Los diálogos de sabiduría sobre el sufrimiento eran comunes en Mesopotamia y Egipto, pero aquí se rechazan las respuestas fáciles de los amigos y Dios responde desde el torbellino. El libro insiste en que Dios es justo y sabio, aun cuando es misterioso.","wd":"Un Cercano Oriente de la era patriarcal, de clanes nómadas, con escenarios edomitas y árabes.","ev":["El desafío celestial y las pérdidas de Job","Tres amigos ofrecen explicaciones","Job protesta y apela a Dios","Habla Elihú","Dios responde; Job es restaurado"],"ref":"Job 19:25–27"},{"a":"David, Asaf, los hijos de Coré, Salomón, Moisés y otros","wl":"c. 1400–430 a. C. (compilado a lo largo de siglos)","pl":"Jerusalén, el desierto, el exilio","sum":"El libro de oración de Israel: cinco colecciones de alabanza, lamento, acción de gracias y cantos reales y mesiánicos.","ctx":"Los Salmos abarcan mil años de la vida de Israel: Moisés en el Sinaí (Sal. 90), David huyendo de Saúl y de Absalón, el Templo de Salomón, los Cantos de Ascenso entonados por los peregrinos y lamentos del exilio (Sal. 137). Fueron reunidos en cinco libros después del regreso de Babilonia. El Nuevo Testamento los cita más que a cualquier otro libro del Antiguo Testamento.","wd":"Desde el desierto, pasando por el Israel davídico, hasta Asiria, Babilonia y Persia.","ev":["Salmos de David ligados a episodios de su vida (Sal. 3, 34, 51)","Adoración en el Templo y cantos de las fiestas","Cantos de Ascenso para los peregrinos (Sal. 120–134)","Lamentos del exilio (Sal. 137)","Salmos reales y mesiánicos (Sal. 2, 110)"],"ref":"Salmo 23"},{"a":"Salomón, con Agur, Lemuel y otros","wl":"c. 970–700 a. C.","pl":"Jerusalén","sum":"Dichos breves e instrucciones sobre la sabiduría, la justicia y la vida diaria, arraigados en el temor del SEÑOR.","ctx":"Salomón era conocido por una sabiduría que atraía visitantes de otras naciones, y la literatura sapiencial internacional, como la Instrucción de Amenemope de Egipto, contiene dichos similares. Más tarde, los escribas de Ezequías copiaron más proverbios de Salomón (Prov. 25:1). La colección forma a los jóvenes para la vida en la comunidad del pacto.","wd":"Las tradiciones de sabiduría cortesana de Egipto y Mesopotamia; la monarquía de Israel, primero unida y luego dividida.","ev":["La sabiduría clama en las calles (caps. 1–9)","Los dichos de Salomón (caps. 10–22)","Dichos de los sabios; la colección de Ezequías (caps. 25–29)","Agur, Lemuel y la mujer virtuosa (caps. 30–31)"],"ref":"Proverbios 3:5–6"},{"a":"Qohélet, 'el Maestro' (tradicionalmente Salomón)","wl":"c. 935 a. C. (tradicional)","pl":"Jerusalén","sum":"Un rey reflexiona sobre si la vida 'debajo del sol' tiene sentido y concluye que temer a Dios es lo esencial.","ctx":"El Maestro tiene riqueza, sabiduría y poder a una escala como la de Salomón, y prueba el placer, el trabajo y el saber, y lo halla todo como un vapor. Escrito sobre un trasfondo de esplendor real y decadencia, el libro plantea preguntas duras sobre la muerte y la injusticia y apunta a disfrutar los dones de Dios. Algunos eruditos lo fechan más tarde.","wd":"El Israel próspero de Salomón, con conexiones comerciales con Fenicia y Egipto.","ev":["La búsqueda de sentido en la sabiduría, el placer y el trabajo","Hay un tiempo para todo (cap. 3)","La injusticia, la muerte y los límites de la riqueza","Consejos para vivir con sabiduría","La conclusión: teme a Dios y guarda sus mandamientos"],"ref":"Eclesiastés 12:13–14"},{"a":"Salomón (tradicional)","wl":"c. 965 a. C. (tradicional)","pl":"Jerusalén y el campo","sum":"Un poema de amor que celebra el matrimonio, el deseo y la fidelidad.","ctx":"El Israel real bajo Salomón era un mundo de viñedos, especias y lujos importados, y las imágenes del poema se nutren de los jardines, los rebaños y la corte real de Israel. Judíos y cristianos lo han leído como una celebración del amor conyugal y, en la tradición cristiana, como un eco del amor de Cristo por la iglesia.","wd":"Una monarquía unida y próspera, en paz con Egipto y Tiro.","ev":["El anhelo de los amantes","La boda","Ausencia y búsqueda","Deleite mutuo y compromiso","Un amor fuerte como la muerte"],"ref":"Cantares 8:6–7"},{"a":"Isaías hijo de Amoz","wl":"c. 740–680 a. C.","pl":"Jerusalén","sum":"Juicio y consuelo: Dios juzgará el pecado, pero promete un rey venidero y un siervo que sufre.","ctx":"Isaías ejerce su ministerio durante la crisis asiria: el ascenso de Tiglat-pileser III, la guerra sirio-efraimita (735–732 a. C.), la caída de Samaria y el sitio de Jerusalén por Senaquerib. Los capítulos 40–66 hablan del exilio y del regreso futuros, e incluso mencionan a Ciro por nombre. El Nuevo Testamento cita a Isaías más que a cualquier otro profeta al presentar a Jesús.","wd":"Asiria bajo Tiglat-pileser III, Sargón II y Senaquerib; Egipto y Babilonia como potencias rivales.","ev":["El llamado de Isaías en el Templo (740 a. C.)","La señal de Emanuel al rey Acaz","Cae Samaria (722 a. C.)","La crisis de Ezequías (701 a. C.)","Consuelo para los exiliados; el Siervo sufriente"],"ref":"Isaías 53"},{"a":"Jeremías (con Baruc como escriba)","wl":"c. 627–570 a. C.","pl":"Jerusalén, luego Egipto","sum":"Jeremías advierte a Judá durante cuarenta años, llora su caída y promete un nuevo pacto.","ctx":"Llamado en el año trece de Josías (627 a. C.), Jeremías ve el colapso de Asiria, el choque de Egipto y Babilonia en Carquemis (605) y la caída de Jerusalén (586). Es objeto de burlas, es encarcelado y finalmente llevado a Egipto. Su carta a los exiliados les dice que busquen el bienestar de la ciudad donde viven.","wd":"El colapso de Asiria; Babilonia bajo Nabucodonosor; Egipto bajo Necao y Hofra.","ev":["Llamado siendo joven (627 a. C.)","El sermón del Templo y la muerte de Josías","Joacim quema el rollo","Carta a los exiliados; el nuevo pacto","Caída de Jerusalén y huida a Egipto"],"ref":"Jeremías 31:31–34"},{"a":"Tradicionalmente Jeremías","wl":"c. 586–580 a. C.","pl":"Jerusalén en ruinas","sum":"Cinco poemas de dolor por la destrucción de Jerusalén, con una chispa de esperanza en el amor fiel de Dios.","ctx":"Escritos entre las ruinas tras el sitio de Babilonia, los poemas muestran el hambre, la pérdida del Templo y la vergüenza nacional. Cuatro de los cinco son acrósticos, que dan al dolor una forma ordenada. En el centro, el capítulo 3 se aferra a las misericordias de Dios, nuevas cada mañana.","wd":"El Imperio babilónico en su apogeo.","ev":["Jerusalén yace desolada","La ira de Dios y la caída del Templo","Grande es tu fidelidad (cap. 3)","Hambre y horror durante el sitio","Una oración por la restauración"],"ref":"Lamentaciones 3:22–23"},{"a":"Ezequiel, sacerdote y profeta","wl":"c. 593–571 a. C.","pl":"Babilonia, junto al canal del Quebar","sum":"Un sacerdote en el exilio ve la gloria de Dios salir del Templo, y luego profetiza renovación, un corazón nuevo y un templo restaurado.","ctx":"Deportado en 597 a. C. junto con el rey Joaquín, Ezequiel profetiza entre los exiliados en Babilonia. Sus primeros mensajes advierten que Jerusalén caerá; después del 586, promete restauración: los huesos secos viven y el Espíritu da un corazón nuevo. Las visiones de un nuevo templo muestran el regreso de la presencia de Dios.","wd":"El Imperio babilónico; exiliados de Judá asentados en Mesopotamia.","ev":["Visión de la gloria de Dios (593 a. C.)","La gloria se aleja del Templo","Se anuncia el sitio de Jerusalén","El valle de los huesos secos","Visión del nuevo Templo"],"ref":"Ezequiel 36:26–27"},{"a":"Daniel","wl":"c. 530 a. C. (tradicional); algunos eruditos c. 165 a. C.","pl":"Babilonia y Persia","sum":"Exiliados fieles sirven en cortes paganas mientras Dios muestra que Él gobierna todos los reinos, presentes y futuros.","ctx":"Daniel es llevado a Babilonia en 605 a. C. y sirve bajo Nabucodonosor, Belsasar y los persas. El horno y el foso de los leones muestran fidelidad bajo presión; las visiones de estatuas y bestias representan imperios sucesivos y el reino eterno de Dios. Los eruditos debaten si las visiones son profecía o fueron escritas durante la crisis de los macabeos.","wd":"El Imperio neobabilónico, luego el Imperio medo-persa bajo Ciro.","ev":["Deportación a Babilonia (605 a. C.)","El sueño de Nabucodonosor sobre la estatua","El horno de fuego","La escritura en la pared; cae Babilonia (539 a. C.)","El foso de los leones","Visiones de bestias y del Hijo del Hombre"],"ref":"Daniel 7:13–14"},{"a":"Oseas","wl":"c. 755–715 a. C.","pl":"El reino del norte (Israel)","sum":"A través de su propio matrimonio con una esposa infiel, Oseas muestra el amor persistente de Dios por un Israel infiel.","ctx":"Oseas profetiza cuando la prosperidad de Israel bajo Jeroboam II (793–753 a. C.) da paso al caos político: seis reyes en unos treinta años, varios de ellos asesinados. Israel busca el favor de Asiria y de Egipto y mezcla la adoración al SEÑOR con la de Baal. Oseas habla de juicio y de restauración.","wd":"Asiria en ascenso bajo Tiglat-pileser III; se busca la ayuda de Egipto.","ev":["El matrimonio de Oseas con Gomer","Los nombres de sus hijos anuncian juicio","La idolatría de Israel y sus intrigas políticas","La compasión de Dios por su pueblo","Promesa de regreso"],"ref":"Oseas 6:6"},{"a":"Joel","wl":"Debatido: c. 830 a. C. o c. 500 a. C.","pl":"Judá y Jerusalén","sum":"Una plaga de langostas se convierte en imagen del venidero Día del SEÑOR, con la promesa de derramar el Espíritu.","ctx":"Joel no menciona a ningún rey, por lo que la fecha se debate. Una fecha temprana encaja con el reinado de Joás, cuando los sacerdotes guiaban al joven rey; una fecha tardía encaja con la Jerusalén posterior al exilio. Pedro cita Joel 2 en Pentecostés para explicar el derramamiento del Espíritu.","wd":"Según la lectura temprana: Aram-Damasco fuerte, Asiria aún lejana.","ev":["La invasión de langostas devasta la tierra","Llamado al arrepentimiento y al ayuno","Promesa de restauración","Derramamiento del Espíritu sobre todo el pueblo","El Día del SEÑOR y el juicio de las naciones"],"ref":"Joel 2:28–29"},{"a":"Amós, pastor de Tecoa","wl":"c. 760–750 a. C.","pl":"Betel, en el reino del norte","sum":"Un pastor de Judá confronta la prosperidad de Israel, construida sobre la injusticia y una religión vacía.","ctx":"Bajo Jeroboam II y Uzías, ambos reinos gozaron de su mayor territorio y riqueza desde Salomón, pero los pobres eran aplastados. Amós habla en Betel dos años antes de un terremoto que se recordó por generaciones. Asiria apenas se estaba recuperando; en treinta años sus ejércitos llegarían.","wd":"Asiria temporalmente débil; Aram-Damasco en declive; ambos reinos israelitas prósperos.","ev":["Juicio sobre los vecinos, luego sobre Israel","La opresión de los pobres","Cinco visiones de juicio","Enfrentamiento con Amasías el sacerdote","Promesa de restaurar el tabernáculo caído de David"],"ref":"Amós 5:24"},{"a":"Abdías","wl":"Debatido: c. 586 a. C. o antes","pl":"Edom y Jerusalén","sum":"Dios juzga a Edom por regocijarse ante la caída de Jerusalén y promete que el reino será del SEÑOR.","ctx":"Edom, descendiente de Esaú, era pariente y vecino de Israel al sur del Mar Muerto. Cuando Babilonia destruyó Jerusalén en 586 a. C., Edom se apropió del botín y entregó a los refugiados. Abdías, el libro más corto del Antiguo Testamento, promete que el orgullo de Edom caerá.","wd":"Las conquistas de Babilonia; Edom, un vasallo que se benefició.","ev":["El orgullo de Edom en su fortaleza de roca","La traición de Edom el día en que cayó Jerusalén","El Día del SEÑOR para todas las naciones","Israel restaurado"],"ref":"Abdías 15"},{"a":"Jonás","wl":"c. 780–760 a. C.","pl":"Jope, el mar, Nínive","sum":"Un profeta reacio huye de Dios, es tragado por un gran pez y luego ve a Nínive arrepentirse.","ctx":"Jonás profetizó bajo Jeroboam II (2 Reyes 14:25). Nínive era la capital de Asiria, que pronto destruiría a Israel, así que su reticencia es comprensible. El libro muestra la compasión de Dios incluso por los enemigos de Israel, y Jesús señaló a Jonás como una señal.","wd":"Asiria en un período más débil antes de Tiglat-pileser III; Israel próspero bajo Jeroboam II.","ev":["Jonás huye hacia Tarsis","La tormenta y el gran pez","Oración desde el vientre del pez","Nínive se arrepiente","El enojo de Jonás y la pregunta de Dios"],"ref":"Jonás 4:10–11"},{"a":"Miqueas de Moreset","wl":"c. 735–700 a. C.","pl":"Judá y Jerusalén","sum":"Un profeta de aldea condena a los líderes corruptos y anuncia un gobernante que vendrá de Belén.","ctx":"Miqueas es contemporáneo de Isaías durante la crisis asiria; predice la caída de Samaria (722 a. C.) y advierte a Jerusalén. Su resumen de lo que Dios requiere, justicia, misericordia y humildad, es de las frases más conocidas de los profetas. Mateo 2 cita la promesa de un gobernante que vendría de Belén.","wd":"La expansión asiria desde Tiglat-pileser III hasta Senaquerib.","ev":["Juicio sobre Samaria y Jerusalén","La opresión de los grandes terratenientes","Paz en el monte del SEÑOR","Un gobernante de Belén","Lo que Dios requiere: justicia, bondad, humildad"],"ref":"Miqueas 6:8"},{"a":"Nahúm de Elcos","wl":"c. 663–612 a. C.","pl":"Judá; un oráculo sobre Nínive","sum":"Una profecía sobre la caída de Nínive, que muestra a Dios como justo y como refugio para quienes confían en Él.","ctx":"Nínive se había arrepentido bajo Jonás, pero luego volvió a la violencia. Nahúm se refiere a la caída de Tebas (663 a. C.) como algo pasado, así que escribe después de ese suceso y antes de que Nínive caiga en 612 a. C. Los medos y los babilonios la destruyeron tal como Nahúm describe.","wd":"Asiria en su apogeo bajo Asurbanipal, y luego su colapso.","ev":["Dios es lento para la ira, pero castigará","Nínive sitiada","Comparación con No-Amón (Tebas)","Cae Nínive (612 a. C.)"],"ref":"Nahúm 1:7"},{"a":"Habacuc","wl":"c. 609–598 a. C.","pl":"Judá","sum":"Un profeta discute con Dios sobre la injusticia y aprende que el justo vivirá por la fe.","ctx":"Habacuc pregunta por qué la malvada Judá queda sin castigo, y se le dice que Babilonia viene. Luego pregunta cómo puede Dios usar a una nación aún peor. El libro termina con un cántico de confianza. Pablo cita 2:4 en Romanos y Gálatas, y el versículo se convirtió en grito de batalla de la Reforma.","wd":"Babilonia reemplaza a Asiria como superpoten
