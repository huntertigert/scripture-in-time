cia después de Carquemis.","ev":["Primera queja: la injusticia en Judá","Dios: Babilonia será levantada","Segunda queja: ¿cómo puede Dios usar a los babilonios?","El justo vivirá por la fe","Una oración de confianza en toda circunstancia"],"ref":"Habacuc 2:4"},{"a":"Sofonías","wl":"c. 640–621 a. C.","pl":"Jerusalén","sum":"Una advertencia del gran Día del SEÑOR, con la promesa de que Dios se regocijará por un remanente purificado.","ctx":"Sofonías profetiza al comienzo del reinado de Josías, antes de las reformas del 622 a. C. Judá viene de la idolatría de Manasés y del breve gobierno de Amón. Llama al arrepentimiento y promete un remanente humilde.","wd":"Asiria debilitándose; Babilonia comenzando a ascender.","ev":["Juicio sobre los idólatras de Judá","Descripción del Día del SEÑOR","Juicio sobre las naciones","Promesa de un remanente humilde","Dios se regocija por su pueblo"],"ref":"Sofonías 3:17"},{"a":"Hageo","wl":"520 a. C.","pl":"Jerusalén","sum":"Hageo llama a los exiliados que regresaron a reconstruir el Templo y promete la presencia y la bendición de Dios.","ctx":"Dieciocho años después del regreso, los cimientos del Templo seguían sin terminar mientras la gente vivía en casas con paneles de madera. Hageo entrega cuatro mensajes en 520 a. C., cada uno fechado según el reinado de Darío. Zorobabel y el sumo sacerdote Josué lideran, y el Templo se termina en 516 a. C.","wd":"El Imperio persa bajo Darío I.","ev":["El llamado a reconstruir: consideren sus caminos","La gloria de la casa postrera","El pueblo es animado","La promesa a Zorobabel"],"ref":"Hageo 2:9"},{"a":"Zacarías","wl":"c. 520–480 a. C.","pl":"Jerusalén","sum":"Visiones y oráculos animan la reconstrucción y anuncian un rey humilde y un pastor traspasado.","ctx":"Zacarías profetiza junto con Hageo, con ocho visiones nocturnas en 519 a. C. Los capítulos posteriores (9–14) miran hacia un rey que cabalga en un asno, un pastor herido y el reinado de Dios sobre toda la tierra. Los Evangelios recurren a estos capítulos en el relato de la Semana Santa.","wd":"Persia bajo Darío I; Grecia comenzando a ascender (Maratón, 490 a. C.).","ev":["Ocho visiones nocturnas","Josué el sumo sacerdote es purificado","Un llamado a la justicia y la misericordia, no solo a los ayunos","El rey que viene en un asno","Victoria final y el Día del SEÑOR"],"ref":"Zacarías 9:9"},{"a":"Malaquías","wl":"c. 430 a. C.","pl":"Jerusalén","sum":"El último profeta del Antiguo Testamento confronta la adoración displicente y promete un mensajero que preparará el camino.","ctx":"Escrito alrededor de la época de Nehemías, Malaquías se dirige a una comunidad posterior al exilio cansada de esperar: los sacerdotes ofrecen sacrificios defectuosos, se retienen los diezmos y los matrimonios son infieles. Su promesa de un mensajero semejante a Elías prepara el Nuevo Testamento y a Juan el Bautista. Siguen unos cuatro siglos de silencio profético.","wd":"Dominio persa; la época clásica de Grecia en su apogeo.","ev":["El amor de Dios por Jacob","Los sacerdotes deshonran el altar","Infidelidad en el matrimonio; diezmos retenidos","El mensajero que prepara el camino","El sol de justicia y Elías"],"ref":"Malaquías 3:1"},{"a":"Mateo (Leví), cobrador de impuestos y apóstol","wl":"c. 60–70 d. C.","pl":"Judea y Galilea; probablemente escrito en Siria","sum":"Presenta a Jesús como el Mesías y Rey prometido, que cumple las Escrituras de Israel.","ctx":"Mateo escribe para una audiencia judía bajo el dominio romano, y cita el Antiguo Testamento más que cualquier otro Evangelio. Jesús nace bajo Herodes el Grande y ejerce su ministerio bajo Herodes Antipas en Galilea y Pilato en Judea. Fariseos, saduceos y zelotes son las facciones judías de la época, mientras que los caminos y la paz de Roma pronto llevarían el evangelio hacia afuera.","wd":"El Imperio romano bajo Augusto y Tiberio; Herodes el Grande y sus hijos; Pilato como prefecto.","ev":["Nacimiento en Belén, los magos, huida a Egipto","Bautismo y tentación","El Sermón del Monte","Parábolas del reino","El discurso del Monte de los Olivos","Crucifixión, resurrección y la Gran Comisión"],"ref":"Mateo 28:18–20"},{"a":"Juan Marcos, colaborador de Pedro","wl":"c. 55–65 d. C.","pl":"Galilea y Judea; probablemente escrito en Roma","sum":"Un relato vertiginoso de Jesús como el Siervo que sufre y el Hijo de Dios, que da su vida en rescate.","ctx":"La tradición de la iglesia primitiva dice que Marcos puso por escrito los recuerdos de Pedro para los creyentes de Roma, quienes probablemente enfrentaban las dificultades de la época de Nerón. Marcos explica costumbres judías y traduce frases arameas para lectores gentiles. A los emperadores de Roma se les llamaba hijos de dios, lo que da más fuerza a la frase inicial de Marcos.","wd":"Imperio romano bajo Tiberio; Pilato, prefecto de Judea (26–36 d. C.).","ev":["Bautismo por Juan y comienzo del ministerio","Sanidades y creciente oposición","La confesión de Pedro en Cesarea de Filipo","El viaje a Jerusalén","La pasión y la tumba vacía"],"ref":"Marcos 10:45"},{"a":"Lucas el médico, compañero de Pablo","wl":"c. 60–62 d. C.","pl":"Judea, Galilea, Samaria; escrito para Teófilo","sum":"Un relato cuidadosamente investigado de la vida de Jesús, con atención especial a los pobres, los marginados y las mujeres.","ctx":"Lucas sitúa a Jesús en la historia mundial: el censo de Augusto, Cirenio gobernando Siria, el año quince de Tiberio, Pilato, Herodes, Anás y Caifás. Como escritor gentil, destaca la misión de Jesús para todos los pueblos. Su Evangelio y Hechos forman una obra en dos partes.","wd":"Roma bajo Augusto y Tiberio; Herodes el Grande y Antipas; Pilato; Anás y Caifás como sumos sacerdotes.","ev":["El nacimiento de Juan y de Jesús","El niño Jesús en el Templo","El sermón en Nazaret y el ministerio en Galilea","Parábolas: el buen samaritano, el hijo pródigo","El viaje a Jerusalén, la crucifixión y la resurrección","El camino a Emaús"],"ref":"Lucas 19:10"},{"a":"Juan el apóstol","wl":"c. 85–95 d. C.","pl":"Judea, Galilea, Jerusalén; escrito en Éfeso","sum":"Las señales y los dichos «Yo soy» muestran a Jesús como la Palabra eterna hecha carne, para que los lectores crean y tengan vida.","ctx":"Juan escribe décadas después de los demás, quizás desde Éfeso, para una iglesia que enfrentaba presión tanto de la sinagoga como del imperio. Sigue las visitas de Jesús a Jerusalén para las fiestas, como la Pascua, los Tabernáculos y la Dedicación. Con el Templo destruido en el 70 d. C., su afirmación de que Jesús reemplaza al Templo adquiere mayor peso.","wd":"Roma bajo Tiberio para la historia narrada; después del 70 d. C. y bajo Domiciano para la redacción.","ev":["La Palabra se hizo carne","El agua convertida en vino; Nicodemo; la mujer en el pozo","La alimentación de los 5.000 y el Pan de Vida","La resurrección de Lázaro","El discurso del Aposento Alto","Crucifixión y apariciones después de la resurrección"],"ref":"Juan 20:30–31"},{"a":"Lucas","wl":"c. 62 d. C.","pl":"De Jerusalén a Roma","sum":"La iglesia nace en Pentecostés y se extiende de Jerusalén a Roma por medio de Pedro, Pablo y otros.","ctx":"Hechos sigue el evangelio por los caminos romanos y las rutas marítimas durante la Pax Romana. Las referencias de Lucas a funcionarios como Galión, Félix, Festo y Herodes Agripa permiten a los historiadores fechar los viajes de Pablo. El libro termina con Pablo bajo arresto domiciliario en Roma, hacia el 60–62 d. C., mientras Nerón es emperador.","wd":"Roma bajo Tiberio, Claudio y Nerón; Herodes Agripa I; los gobernadores Félix y Festo.","ev":["Ascensión y Pentecostés","Esteban es martirizado; la iglesia se dispersa","La conversión de Saulo","Pedro y Cornelio; los gentiles reciben el Espíritu","Los tres viajes misioneros de Pablo","Arresto, juicios y el viaje a Roma"],"ref":"Hechos 1:8"},{"a":"Pablo","wl":"c. 57 d. C.","pl":"Escrita desde Corinto a Roma","sum":"La exposición más completa del evangelio por parte de Pablo: el pecado, la justificación por la fe, la vida en el Espíritu, y judíos y gentiles juntos.","ctx":"Claudio expulsó a los judíos de Roma en el año 49 d. C., y para el reinado de Nerón estaban regresando, así que la iglesia de Roma tenía tensiones entre creyentes judíos y gentiles. De camino a Jerusalén y con la esperanza de ir a España, Pablo escribe para presentarse a sí mismo y presentar su evangelio.","wd":"Los primeros años del reinado de Nerón; Roma en el centro del imperio.","ev":["Todos han pecado; se revela la justicia de Dios (1–3)","La justificación por la fe, con Abraham como ejemplo (4–5)","La nueva vida en el Espíritu (6–8)","El lugar de Israel en el plan de Dios (9–11)","El sacrificio vivo; la unidad de judíos y gentiles (12–16)"],"ref":"Romanos 1:16–17"},{"a":"Pablo","wl":"c. 55 d. C.","pl":"Escrita desde Éfeso a Corinto","sum":"Pablo aborda las divisiones, la inmoralidad, los pleitos, la adoración y la resurrección en una iglesia desordenada pero llena de dones.","ctx":"Corinto, reconstruida por Roma en el 44 a. C., era una próspera ciudad portuaria con dos puertos, famosa por su comercio, sus templos paganos y los Juegos Ístmicos. La iglesia que Pablo plantó allí hacia los años 50–52 d. C. luchaba por vivir de manera distinta a su cultura, lo que explica la variedad de temas que él trata.","wd":"La colonia romana de Corinto; Acaya bajo gobernadores romanos; Claudio y luego Nerón.","ev":["Las divisiones y la sabiduría de la cruz (1–4)","La inmoralidad sexual y los pleitos (5–6)","El matrimonio y la comida ofrecida a los ídolos (7–10)","La adoración, la Cena del Señor y los dones espirituales (11–14)","La resurrección de Cristo y de los creyentes (15)"],"ref":"1 Corintios 15:3–5"},{"a":"Pablo","wl":"c. 56 d. C.","pl":"Escrita desde Macedonia","sum":"Una carta personal de reconciliación, consuelo en el sufrimiento y defensa del ministerio de Pablo.","ctx":"Después de una visita dolorosa y una carta severa, Pablo recibe noticias de Tito de que la mayoría de los corintios se han arrepentido. Escribe con alivio, se defiende de los llamados 'superapóstoles' y organiza la colecta para los pobres de Jerusalén.","wd":"Macedonia y Acaya romanas durante los primeros años del reinado de Nerón.","ev":["El Dios de toda consolación","El ministerio del nuevo pacto","La colecta para Jerusalén","Pablo se gloría en su debilidad","El aguijón en la carne"],"ref":"2 Corintios 12:9"},{"a":"Pablo","wl":"c. 48–55 d. C. (debatido)","pl":"Escrita a las iglesias de Galacia","sum":"Pablo defiende el evangelio de la gracia frente a quienes insistían en que los creyentes gentiles debían guardar la Ley.","ctx":"Después del primer viaje de Pablo, maestros cristianos de origen judío presionaban a los creyentes gentiles para que se circuncidaran. Muchos eruditos fechan Gálatas justo antes del Concilio de Jerusalén (49 d. C.); otros la fechan más tarde, hacia el 55 d. C. De cualquier modo, es la carta magna de la libertad cristiana.","wd":"La provincia romana de Galacia, en el centro de Anatolia; Claudio como emperador.","ev":["El llamado de Pablo y su encuentro con Pedro, Santiago y Juan","La confrontación con Pedro en Antioquía","Justificados por la fe, no por la Ley","Hijos de la promesa, no de la esclavitud","Andad en el Espíritu; el fruto del Espíritu"],"ref":"Gálatas 2:20"},{"a":"Pablo","wl":"c. 60–62 d. C.","pl":"Escrita desde la cárcel en Roma a Éfeso y a las iglesias cercanas","sum":"El plan de Dios para unir a judíos y gentiles en Cristo y para capacitar a la iglesia a vivir de manera digna de su llamado.","ctx":"Éfeso era la ciudad principal de Asia, sede del gran templo de Artemisa y centro de las artes mágicas (Hechos 19). Pablo escribe desde la prisión y ofrece un cuadro amplio de la iglesia como cuerpo y casa de Cristo, con armadura para la batalla espiritual.","wd":"La Asia romana; el imperio de Nerón; el culto a Artemisa en Éfeso.","ev":["Bendiciones espirituales en Cristo","Salvos por gracia mediante la fe","Una nueva humanidad: judíos y gentiles","Unidad y dones en el cuerpo","Instrucciones para el hogar y la armadura de Dios"],"ref":"Efesios 2:8–10"},{"a":"Pablo","wl":"c. 61 d. C.","pl":"Escrita desde Roma a Filipos","sum":"Gozo en el sufrimiento y la humildad: Pablo da gracias a una iglesia generosa y señala la entrega de Cristo.","ctx":"Filipos era una colonia romana poblada con veteranos y orgullosa de su ciudadanía, por eso Pablo dice a los creyentes que su ciudadanía está en los cielos. Fue la primera ciudad europea en oír el evangelio (Hechos 16). Aun escribiendo encadenado, Pablo irradia gozo.","wd":"Una colonia romana en Macedonia; la Roma de Nerón.","ev":["Gratitud y oración","El himno de la humildad de Cristo (2:5–11)","Pablo considera sus credenciales como pérdida","Ciudadanos del cielo","Paz y contentamiento"],"ref":"Filipenses 2:5–8"},{"a":"Pablo","wl":"c. 60–62 d. C.","pl":"Escrita desde Roma a Colosas","sum":"Cristo es supremo sobre todas las cosas, y nada, ya sea filosofía, ritual o ángeles, necesita añadirse a Él.","ctx":"Colosas se hallaba en el valle del Lico, junto con Laodicea y Hierápolis. Maestros que mezclaban el ritual judío, la veneración de ángeles y la filosofía perturbaban a la iglesia. La región fue sacudida por un gran terremoto hacia el 60 d. C., un recordatorio de lo frágiles que son las cosas terrenales.","wd":"La Asia romana bajo Nerón.","ev":["La supremacía de Cristo (1:15–20)","Advertencia contra la filosofía vacía y las reglas","Poned la mira en las cosas de arriba","Instrucciones para el hogar","Saludos: Onésimo, Arquipo, Laodicea"],"ref":"Colosenses 1:15–20"},{"a":"Pablo","wl":"c. 50–51 d. C.","pl":"Escrita desde Corinto a Tesalónica","sum":"Pablo anima a una iglesia joven y perseguida y enseña acerca del regreso de Cristo.","ctx":"Tesalónica era la capital de Macedonia, sobre la Vía Egnatia. Pablo tuvo que irse después de un disturbio (Hechos 17). Poco después de llegar a Corinto, escribe; esta es probablemente una de sus primeras cartas y uno de los primeros escritos del Nuevo Testamento.","wd":"La Roma de Claudio; Macedonia romana.","ev":["Gracias por su fe y perseverancia","El ministerio de Pablo entre ellos","Vivir para agradar a Dios","El regreso de Cristo y los muertos en Cristo","Estar preparados; vivir en paz"],"ref":"1 Tesalonicenses 4:13–18"},{"a":"Pablo","wl":"c. 51 d. C.","pl":"Escrita desde Corinto a Tesalónica","sum":"Pablo aclara la confusión sobre el Día del Señor y exhorta a trabajar con constancia.","ctx":"Poco después de la primera carta, alguien sugirió que el día del Señor ya había llegado. Pablo explica lo que debe ocurrir primero y exhorta a los creyentes ociosos a volver al trabajo. La persecución de la iglesia continúa.","wd":"La Roma de Claudio; Macedonia romana.","ev":["Aliento en medio de la persecución","Los sucesos antes del Día del Señor","Estad firmes en las tradiciones enseñadas","Una advertencia contra la ociosidad"],"ref":"2 Tesalonicenses 2:15"},{"a":"Pablo","wl":"c. 62–64 d. C.","pl":"Escrita a Timoteo en Éfeso","sum":"Instrucciones a un joven líder sobre la sana enseñanza, la adoración y el liderazgo de la iglesia.","ctx":"Después de ser liberado de su primer encarcelamiento en Roma, Pablo dejó a Timoteo en Éfeso para enfrentar a los falsos maestros. La carta establece los requisitos para ancianos y diáconos y describe a la iglesia como la casa de Dios.","wd":"La Roma de Nerón; la ciudad de Éfeso.","ev":["Un encargo para oponerse a los falsos maestros","Oración y orden en la adoración","Requisitos para obispos y diáconos","Cuidado pastoral de distintos grupos","Pelea la buena batalla"],"ref":"1 Timoteo 2:5"},{"a":"Pablo","wl":"c. 64–67 d. C.","pl":"Escrita desde la cárcel en Roma","sum":"La última carta de Pablo: un apóstol anciano exhorta a Timoteo a perseverar y guardar el evangelio.","ctx":"Pablo está preso de nuevo, probablemente bajo Nerón después del incendio de Roma (64 d. C.), cuando se hizo de los cristianos el chivo expiatorio. Esta vez espera morir. Casi todos lo han abandonado, y le pide a Timoteo que venga y traiga su capote y sus rollos.","wd":"La persecución de Nerón después del 64 d. C.","ev":["No te avergüences del evangelio","Soporta como buen soldado","Toda la Escritura es inspirada por Dios","El último encargo: predica la palabra","Pablo: he acabado la carrera"],"ref":"2 Timoteo 4:6–8"},{"a":"Pablo","wl":"c. 62–64 d. C.","pl":"Escrita a Tito en Creta","sum":"Orientación para designar ancianos y vivir la gracia en la isla de Creta.","ctx":"Creta tenía mala fama entre los escritores antiguos. Pablo deja a Tito para organizar allí las iglesias. La carta vincula la sana doctrina con las buenas obras y muestra cómo el evangelio transforma los hogares comunes.","wd":"Creta romana, parte de una provincia conjunta con Cirenaica.","ev":["Nombrar ancianos en cada ciudad","Enseñar sana doctrina a cada grupo","La gracia nos enseña a vivir bien","Evitar las controversias necias","Instrucciones personales"],"ref":"Tito 2:11–14"},{"a":"Pablo","wl":"c. 60–62 d. C.","pl":"Escrita desde Roma a Colosas","sum":"Pablo pide a un cristiano dueño de esclavos que reciba de vuelta como hermano a su esclavo fugitivo Onésimo.","ctx":"La esclavitud estaba entretejida en la economía romana, y los esclavos eran una gran parte de la población en muchas ciudades. Pablo no trata directamente la institución, pero exige un cambio radical en la relación: tratar a Onésimo como a un hermano amado.","wd":"La economía esclavista romana; la Roma de Nerón.","ev":["Pablo agradece a Filemón por su amor","El ruego por Onésimo","Pablo ofrece pagar cualquier deuda","Una esperanza de visitar"],"ref":"Filemón 15–16"},{"a":"Desconocido (se han sugerido Pablo, Bernabé y Apolos)","wl":"c. 64–68 d. C.","pl":"Probablemente escrita a cristianos judíos en Roma o sus alrededores","sum":"Jesús es superior a los ángeles, a Moisés y a los sacerdotes, así que no volváis atrás.","ctx":"Los creyentes, muchos de ellos de origen judío, enfrentaban presión y sufrimiento que los tentaban a volver al judaísmo. El Templo seguía en pie, pues el escritor habla de sacerdotes que ofrecen sacrificios en tiempo presente. El autor muestra cómo el sistema sacrificial del Antiguo Testamento apunta a la ofrenda de Cristo, hecha una vez para siempre.","wd":"Las persecuciones de Nerón; Judea rumbo a la rebelión.","ev":["Jesús es superior a los ángeles y a Moisés","Jesús, el gran sumo sacerdote","Un mejor pacto y un mejor sacrificio","El salón de la fe (cap. 11)","Corramos con perseverancia"],"ref":"Hebreos 4:14–16"},{"a":"Santiago, hermano de Jesús","wl":"c. 45–49 d. C.","pl":"Jerusalén; a los creyentes judíos dispersos en el extranjero","sum":"Sabiduría práctica: la fe verdadera se muestra en obras, en el dominio del habla y en el cuidado de los pobres.","ctx":"Santiago dirigía la iglesia de Jerusalén y escribió temprano, quizás antes del Concilio del año 49 d. C., a cristianos judíos dispersos por la persecución. Escrita al estilo de la literatura sapiencial, hace eco del Sermón del Monte.","wd":"Judea bajo procuradores romanos; Herodes Agripa I (murió en el 44 d. C.).","ev":["Gozo en las pruebas","Sed hacedores, y no solamente oidores","La fe y las obras (cap. 2)","Domar la lengua","Paciencia y oración"],"ref":"Santiago 1:22"},{"a":"Pedro el apóstol","wl":"c. 62–64 d. C.","pl":"Escrita desde 'Babilonia' (Roma) a Asia Menor","sum":"Esperanza para los creyentes que sufren: vivir como extranjeros y seguir el ejemplo de Cristo.","ctx":"Pedro escribe a cristianos dispersos por el norte de Asia Menor que enfrentan calumnias y exclusión social, mientras la hostilidad de Nerón hacia los cristianos sienta un precedente peligroso. 'Babilonia' es muy probablemente un nombre en clave para Roma, como en Apocalipsis.","wd":"La Roma de Nerón; las provincias de Asia Menor.","ev":["Una esperanza viva","Linaje escogido, real sacerdocio","Sufrir como Cristo, y la sumisión","No os sorprendáis del fuego de la prueba","Pastoread el rebaño"],"ref":"1 Pedro 2:9"},{"a":"Pedro el apóstol","wl":"c. 64–68 d. C.","pl":"Probablemente escrita desde Roma","sum":"La despedida de Pedro: crecer en conocimiento, cuidarse de los falsos maestros y ser pacientes ante el regreso de Cristo.","ctx":"Pedro sabe que su muerte está cerca. Advierte sobre falsos maestros que se burlan del regreso de Cristo y recuerda a los lectores la transfiguración y el testimonio apostólico. Algunos eruditos cuestionan la autoría petrina, aunque la iglesia primitiva la aceptó.","wd":"El reinado de Nerón; Roma.","ev":["Haced firme vuestra vocación","Testigos oculares de la transfiguración","Los falsos maestros","Los burladores y la tardanza del regreso del Señor","Creced en la gracia"],"ref":"2 Pedro 3:9"},{"a":"Juan el apóstol","wl":"c. 85–95 d. C.","pl":"La zona de Éfeso","sum":"Examina tu fe por medio de la verdad, la obediencia y el amor, para que sepas que tienes vida eterna.","ctx":"Las iglesias enfrentaban a maestros que negaban que Jesús hubiera venido en carne, y algunos habían abandonado la comunidad. Juan ofrece pruebas: la creencia correcta acerca de Cristo, la obediencia y el amor.","wd":"El reinado de Domiciano; Asia Menor; el culto al emperador.","ev":["Andar en la luz","Probad los espíritus","Dios es amor","Permanecer y amarnos unos a otros","La seguridad de la vida eterna"],"ref":"1 Juan 4:7–8"},{"a":"Juan el anciano","wl":"c. 90 d. C.","pl":"Escrita a una iglesia en Asia Menor","sum":"Una carta breve que exhorta a una iglesia a andar en la verdad y el amor y a no recibir a los engañadores.","ctx":"Los maestros itinerantes dependían de la hospitalidad de los creyentes. Juan advierte a la iglesia que no apoye a quienes niegan que Jesús vino en carne.","wd":"La Roma de Domiciano; las iglesias de Asia Menor.","ev":["Andar en la verdad y el amor","Cuidarse de los engañadores","Los límites de la hospitalidad","Una esperanza de visitar cara a cara"],"ref":"2 Juan 6"},{"a":"Juan el anciano","wl":"c. 90 d. C.","pl":"Escrita a Gayo","sum":"Juan elogia la hospitalidad de Gayo y reprende a Diótrefes, quien rechazó a los mensajeros del apóstol.","ctx":"Los misioneros itinerantes necesitaban anfitriones locales. Gayo los apoyaba; Diótrefes se negó y expulsaba a quienes lo hacían. Juan también elogia a Demetrio.","wd":"La Roma de Domiciano; las iglesias de Asia Menor.","ev":["Gayo, elogiado por andar en la verdad","El orgullo de Diótrefes","Demetrio, elogiado"],"ref":"3 Juan 4"},{"a":"Judas, hermano de Santiago y de Jesús","wl":"c. 65–80 d. C.","pl":"Escrita a cristianos judíos","sum":"Un llamado urgente a contender por la fe frente a intrusos impíos.","ctx":"Judas pensaba escribir acerca de la salvación, pero escribió en cambio sobre falsos maestros que se habían infiltrado en las iglesias y habían convertido la gracia en libertinaje. Recurre a ejemplos del Antiguo Testamento y a algunos escritos judíos como 1 Enoc. Judas, igual que Santiago, no siguió a Jesús durante su ministerio (Juan 7:5), pero llegó a ser su siervo.","wd":"Roma bajo Nerón o los emperadores flavios; Judea en agitación.","ev":["Contender por la fe que ha sido una vez dada","Israel en el desierto, los ángeles, Sodoma","Caín, Balaam y Coré","Edificaos a vosotros mismos","La doxología final (vv. 24–25)"],"ref":"Judas 24–25"},{"a":"Juan","wl":"c. 95 d. C.","pl":"Patmos; las siete iglesias de Asia","sum":"Una visión de la victoria de Cristo, del juicio de Dios sobre el mal y de la nueva creación.","ctx":"Juan está en Patmos a causa de la palabra de Dios, probablemente bajo Domiciano, quien quería que lo llamaran Señor y Dios. Apocalipsis está escrito a siete iglesias reales en ciudades como Éfeso, Esmirna y Pérgamo, muchas de ellas presionadas a unirse a la adoración al emperador. Babilonia aquí muy probablemente representa a Roma. Algunos fechan el libro en el reinado de Nerón (64–68 d. C.), y los cristianos lo han leído de forma preterista, historicista, idealista y futurista.","wd":"Roma bajo Domiciano; el culto imperial floreciente en Asia Menor.","ev":["Cristo entre los siete candeleros","Cartas a las siete iglesias","La sala del trono y el Cordero","Sellos, trompetas y copas","La caída de Babilonia","El cielo nuevo y la tierra nueva"],"ref":"Apocalipsis 21:3–5"}],"events":[{"t":"La creación","d":"Dios crea los cielos y la tierra e hizo a la humanidad a su imagen."},{"t":"La caída","d":"Adán y Eva desobedecen; el pecado y la muerte entran en el mundo, y Dios promete un libertador que vendrá."},{"t":"El diluvio","d":"Dios juzga a un mundo violento y preserva a Noé, a su familia y a los animales; sigue el pacto del arco iris."},{"t":"Torre de Babel","d":"El orgullo humano dispersa a las naciones y prepara el escenario para que Dios llame a Abraham."},{"t":"Egipto se unifica","d":"El Alto y el Bajo Egipto se unen bajo los primeros faraones, y comienza una de las civilizaciones más duraderas de la historia."},{"t":"Se construye la Gran Pirámide","d":"Se alza la pirámide del faraón Keops en Guiza, ya antigua cuando Abraham visita Egipto."},{"t":"Sargón funda el Imperio acadio","d":"El primer gran imperio de Mesopotamia extiende el idioma acadio y la monarquía por toda la región."},{"t":"Ur florece","d":"La Ur sumeria es una ciudad importante con su gran zigurat; la familia de Abraham vive en este mundo."},{"t":"Abraham es llamado","d":"Dios llama a Abram desde Ur y Harán a la tierra de Canaán, y le promete tierra, descendientes y bendición para todas las naciones."},{"t":"José vendido a Egipto","d":"Vendido por sus hermanos, José pasa de la cárcel a ser visir y prepara a Egipto para la hambruna."},{"t":"Israel se establece en Egipto","d":"La familia de Jacob, de setenta personas, se muda a Gosén durante la hambruna y permanece unos 430 años."},{"t":"La Babilonia de Hammurabi","d":"Hammurabi gobierna Mesopotamia desde Babilonia y publica un famoso código de leyes."},{"t":"Los hicsos gobiernan el norte de Egipto","d":"Gobernantes semitas extranjeros dominan el delta del Nilo hasta cerca de 1550 a. C.; algunos los relacionan con una época en que Israel fue bien recibido en Egipto."},{"t":"Comienza el Imperio Nuevo de Egipto","d":"Ahmosis expulsa a los hicsos y funda la dinastía XVIII, que lanza un imperio egipcio que llega hasta Siria."},{"t":"Nace Moisés","d":"Nacido durante el decreto del faraón contra los niños hebreos, Moisés se cría en la casa del faraón."},{"t":"Tutmosis III expande el imperio de Egipto","d":"Sus campañas extienden el control de Egipto hasta el Éufrates; según la tesis de la fecha temprana, es el faraón de la opresión."},{"t":"El Éxodo","d":"Diez plagas, la primera Pascua y el cruce del mar Rojo liberan a Israel de Egipto. Algunos eruditos lo fechan hacia 1260 a. C."},{"t":"La Ley dada en el Sinaí","d":"Dios hace un pacto con Israel, da los Diez Mandamientos, e Israel construye el tabernáculo."},{"t":"Israel se niega a entrar en Canaán","d":"Tras el informe de los espías en Cades, el temor de Israel lleva a cuarenta años en el desierto."},{"t":"Muere Moisés; Josué cruza el Jordán","d":"Moisés pronuncia el Deuteronomio y muere en el monte Nebo; Israel entra en la tierra y cae Jericó."},{"t":"Las cartas de Amarna","d":"Reyes cananeos escriben a Egipto sobre las bandas de habiru que saquean, una instantánea del caos político de Canaán."},{"t":"Batalla de Cades","d":"Ramsés II combate contra los hititas en Siria en una de las mayores batallas de carros de las que se tiene registro."},{"t":"Débora y Barac derrotan a Sísara","d":"Una mujer juez y su general quiebran un ejército cananeo de carros."},{"t":"Los Pueblos del Mar y el colapso de la Edad del Bronce","d":"Caen grandes potencias; Ramsés III detiene a los Pueblos del Mar, y los filisteos se establecen en la costa de Canaán."},{"t":"Gedeón derrota a Madián","d":"Trescientos hombres ponen en fuga a los merodeadores madianitas."},{"t":"Rut y Booz","d":"Una viuda moabita encuentra un hogar en Belén y llega a ser bisabuela de David."},{"t":"Nace Samuel","d":"La oración de Ana es contestada; Samuel llega a ser el último juez y el profeta que unge a los primeros reyes de Israel."},{"t":"Sansón; el arca capturada","d":"Sansón lucha contra los filisteos; más tarde los filisteos capturan el arca y muere Elí."},{"t":"Se difunde el alfabeto","d":"El alfabeto fenicio, antecesor de las letras hebreas, griegas y latinas, se difunde por la costa."},{"t":"Saúl es ungido rey","d":"Se concede el reclamo de Israel por un rey; Saúl reina unos cuarenta años."},{"t":"Comienza la dinastía Zhou en China","d":"Los Zhou reclaman el Mandato del Cielo y gobiernan durante siglos."},{"t":"David llega a ser rey","d":"Después de que Saúl muere en Gilboa, David es ungido rey de Judá en Hebrón, y más tarde de todo Israel."},{"t":"David toma Jerusalén","d":"David conquista Jerusalén, la hace su capital y trae el arca a ella."},{"t":"El pacto davídico","d":"Dios promete a David una dinastía eterna, promesa que los cristianos ven cumplida en Jesús."},{"t":"Salomón llega a ser rey","d":"Salomón pide sabiduría, y comienza la edad de oro de Israel."},{"t":"Salomón comienza el Templo","d":"Empieza la obra del primer Templo en Jerusalén, que tardó siete años en construirse."},{"t":"El reino se divide","d":"Tras la muerte de Salomón, diez tribus siguen a Jeroboam en el norte (Israel), mientras Roboam gobierna Judá."},{"t":"El faraón Sisac ataca Israel y Judá","d":"Sheshonq I de Egipto hace campaña en Canaán, hecho registrado tanto en la Biblia como en los relieves del templo egipcio de Karnak."},{"t":"Omri edifica Samaria","d":"La dinastía de Omri hace de Samaria la capital de Israel; el matrimonio de Acab con Jezabel trae el culto a Baal."},{"t":"Elías en el monte Carmelo","d":"Elías desafía a los profetas de Baal; cae fuego y el pueblo declara que el SEÑOR es Dios."},{"t":"Batalla de Qarqar","d":"Salmanasar III de Asiria combate contra una coalición que incluye al rey Acab de Israel, a quien nombran los registros asirios."},{"t":"La rebelión de Jehú","d":"Jehú extermina la casa de Acab, y Atalía se apodera del trono de Judá hasta que Joás es coronado. Jehú aparece pagando tributo en el Obelisco Negro de Asiria."},{"t":"Se funda Cartago","d":"Colonos fenicios de Tiro fundan Cartago (fecha tradicional), más tarde gran rival de Roma."},{"t":"Jonás enviado a Nínive","d":"Un profeta renuente predica en la capital de Asiria y la ciudad se arrepiente."},{"t":"Primeros Juegos Olímpicos","d":"Se celebran en Grecia los primeros Juegos Olímpicos de los que hay registro (fecha tradicional)."},{"t":"Amós y Oseas profetizan","d":"La prosperidad y la injusticia en el Israel de Jeroboam II provocan un severo reproche profético."},{"t":"Se funda Roma (tradicional)","d":"Según la tradición, se funda la ciudad que algún día gobernaría el Mediterráneo y Judea."},{"t":"Tiglat-pileser III revive Asiria","d":"Un ejército profesional y una política de deportación masiva inician la conquista de la región por Asiria."},{"t":"El llamamiento de Isaías","d":"En el año en que murió el rey Uzías, Isaías ve al SEÑOR en el Templo y es comisionado."},{"t":"Guerra siro-efraimita; la señal del Emanuel","d":"Israel y Aram atacan a Judá; Isaías dice a Acaz que confíe en Dios, no en Asiria, y le da la señal del Emanuel."},{"t":"Cae Samaria; las tribus del norte son exiliadas","d":"Asiria conquista Israel y deporta a gran parte de su población."},{"t":"Senaquerib sitia Jerusalén","d":"Ezequías ora, y el ejército asirio se retira; el propio prisma de Senaquerib registra el sitio."},{"t":"Asiria saquea Tebas","d":"Asurbanipal destruye la capital del sur de Egipto, un hecho que Nahúm recuerda."},{"t":"Josías encuentra el Libro de la Ley","d":"La Ley es hallada en el Templo; Josías purga la idolatría y renueva el pacto."},{"t":"Cae Nínive","d":"Babilonios y medos destruyen la capital de Asiria, como lo anunciaron Nahúm y Sofonías."},{"t":"Josías muere en Meguido","d":"Josías muere combatiendo al faraón Necao; Judá cae en la órbita de Egipto y luego en la de Babilonia."},{"t":"Babilonia derrota a Egipto en Carquemis","d":"La victoria de Nabucodonosor convierte a Babilonia en la superpotencia; ese año él llega a ser rey."},{"t":"Primera deportación; Daniel llevado a Babilonia","d":"Nabucodonosor se lleva a los nobles de Judá, entre ellos Daniel y sus amigos."},{"t":"Segunda deportación; Ezequiel desterrado","d":"El rey Joaquín y unas diez mil personas son llevados a Babilonia."},{"t":"Jerusalén y el Templo destruidos","d":"Babilonia incendia Jerusalén; Judá va al exilio."},{"t":"Joaquín es liberado","d":"El rey de Babilonia saca a Joaquín de la prisión, el último vistazo de la línea de David en 2 Reyes."},{"t":"La era de los sabios","d":"Confucio en China y Buda en la India enseñan en esta época; comienza la filosofía griega. Las fechas se debaten."},{"t":"Ciro une a los medos y persas","d":"Ciro construye el imperio más grande que se había visto hasta entonces."},{"t":"Babilonia cae ante Ciro","d":"La ciudad es tomada casi sin lucha, como describe Daniel 5."},{"t":"Decreto de Ciro; el primer regreso","d":"Ciro permite que los judíos vuelvan a casa y reconstruyan el Templo; Zorobabel guía al primer grupo."},{"t":"Se completa el Segundo Templo","d":"Impulsados por Hageo y Zacarías, los exiliados que regresaron terminan el Templo."},{"t":"Fundación de la República Romana","d":"Roma expulsa a su último rey y comienza casi cinco siglos como república."},{"t":"Las guerras greco-persas","d":"Los persas de Jerjes luchan contra los griegos en las Termópilas y Salamina; las ciudades-estado griegas sobreviven."},{"t":"Ester salva a los judíos","d":"Ester y Mardoqueo frustran el complot de Amán, y nace el Purim."},{"t":"Esdras regresa a Jerusalén","d":"Esdras el escriba llega con respaldo real para enseñar la Ley."},{"t":"Nehemías reconstruye el muro","d":"Los muros de Jerusalén se levantan en 52 días a pesar de la oposición."},{"t":"Malaquías, el último profeta del Antiguo Testamento","d":"La voz profética se silencia por unos cuatrocientos años."},{"t":"Ejecución de Sócrates","d":"Atenas condena a muerte a Sócrates; su discípulo Platón y luego Aristóteles dan forma al pensamiento occidental."},{"t":"Alejandro conquista el Imperio Persa","d":"La lengua y la cultura griegas se extienden por el Cercano Oriente."},{"t":"Muere Alejandro; su imperio se divide","d":"Los Ptolomeos en Egipto y los Seléucidas en Siria se disputarán Judea."},{"t":"Comienza la Septuaginta","d":"Eruditos judíos en Alejandría empiezan a traducir las Escrituras hebreas al griego, la Biblia que citan la mayoría de los escritores del Nuevo Testamento."},{"t":"Qin unifica China","d":"El primer emperador une los estados en guerra de China."},{"t":"Los Seléucidas toman Judea","d":"Antíoco III derrota a Egipto, y Judea queda bajo el dominio greco-sirio."},{"t":"Antíoco IV profana el Templo; la revuelta macabea","d":"Antíoco levanta un altar pagano en el Templo, y los Macabeos encabezan una rebelión."},{"t":"El Templo es rededicado","d":"Judas Macabeo purifica el Templo; la Fiesta de la Dedicación (Janucá, Juan 10) lo recuerda."},{"t":"Roma destruye Cartago y Corinto","d":"Roma se convierte en la potencia dominante del Mediterráneo y se apodera de Grecia."},{"t":"Independencia asmonea","d":"Judea obtiene su independencia bajo la dinastía asmonea durante unos ochenta años."},{"t":"Pompeyo toma Jerusalén","d":"Roma conquista Judea, y el dominio romano continúa hasta la era del Nuevo Testamento."},{"t":"Asesinato de Julio César","d":"Siguen las guerras civiles, que terminan con Augusto como único gobernante."},{"t":"Herodes el Grande se convierte en rey","d":"Roma nombra a Herodes rey de Judea; es un gran constructor y un gobernante brutal."},{"t":"Augusto se convierte en el primer emperador romano","d":"Tras derrotar a Antonio y Cleopatra en Accio (31 a. C.), Octavio gobierna como Augusto; comienza la Pax Romana."},{"t":"Herodes reconstruye el Templo","d":"Comienza una vasta ampliación del Segundo Templo, que aún está en marcha en los días de Jesús."},{"t":"Nace Jesús","d":"Nace en Belén bajo Augusto y Herodes; pastores y magos vienen a adorarlo."},{"t":"Muere Herodes el Grande","d":"Su reino se divide entre sus hijos Arquelao, Antipas y Felipe."},{"t":"Judea se convierte en provincia romana","d":"Arquelao es depuesto y los gobernadores romanos toman el mando. El censo bajo Cirenio en Lucas 2 suele vincularse con este período, un punto debatido."},{"t":"Jesús en el Templo a los doce años","d":"Jesús asombra a los maestros en Jerusalén durante la Pascua."},{"t":"Tiberio se convierte en emperador","d":"Reina durante todo el ministerio público de Jesús."},{"t":"Poncio Pilato se convierte en prefecto de Judea","d":"Gobierna hasta el 36 d. C. y condena a Jesús."},{"t":"Juan el Bautista; Jesús es bautizado","d":"Jesús comienza su ministerio público en Galilea y Judea."},{"t":"Crucifixión y resurrección","d":"Jesús es crucificado bajo Pilato y resucita al tercer día (la fecha es 30 o 33 d. C.)."},{"t":"Pentecostés","d":"El Espíritu desciende sobre los discípulos, y la iglesia nace en Jerusalén."},{"t":"Martirio de Esteban; la iglesia se dispersa","d":"La persecución extiende el evangelio a Judea, Samaria y más allá."},{"t":"Conversión de Pablo","d":"Saulo se encuentra con Cristo resucitado en el camino a Damasco."},{"t":"El evangelio llega a los gentiles","d":"Pedro predica a Cornelio, y una iglesia mixta crece en Antioquía."},{"t":"Claudio se convierte en emperador","d":"Gobierna hasta el 54 d. C."},{"t":"Herodes Agripa I persigue a la iglesia","d":"Santiago es muerto, Pedro encarcelado, y Agripa muere repentinamente."},{"t":"Primer viaje misionero de Pablo","d":"Bernabé y Pablo plantan iglesias en Chipre y Galacia."},{"t":"Claudio expulsa a los judíos de Roma","d":"Priscila y Aquila se mudan a Corinto, donde conocen a Pablo."},{"t":"El Concilio de Jerusalén","d":"Los apóstoles deciden que los creyentes gentiles no necesitan guardar toda la Ley."},{"t":"Segundo viaje misionero de Pablo","d":"Filipos, Tesalónica, Atenas y Corinto oyen el evangelio."},{"t":"Tercer viaje de Pablo; Éfeso","d":"Pablo pasa unos tres años en Éfeso, y luego viaja por Macedonia y Corinto."},{"t":"Nerón se convierte en emperador","d":"El último emperador de la dinastía julio-claudia comienza su reinado."},{"t":"Pablo es arrestado en Jerusalén","d":"Pasa dos años bajo custodia en Cesarea antes de apelar al César."},{"t":"Pablo bajo arresto domiciliario en Roma","d":"Pablo predica abiertamente mientras espera el juicio y escribe varias cartas."},{"t":"Incendio de Roma; persecución de Nerón","d":"Nerón culpa a los cristianos del incendio, y comienza la persecución."},{"t":"Martirio de Pedro y Pablo (tradición)","d":"La tradición antigua dice que ambos apóstoles murieron en Roma bajo Nerón."},{"t":"Comienza la rebelión judía contra Roma","d":"La revuelta en Judea desemboca en una guerra de cuatro años."},{"t":"Jerusalén y el Templo destruidos","d":"Las legiones de Tito incendian la ciudad, como Jesús lo predijo, poniendo fin al sistema de sacrificios."},{"t":"El Vesubio sepulta Pompeya","d":"La erupción congela en el tiempo a una ciudad romana."},{"t":"Domiciano se convierte en emperador","d":"Exige que se dirijan a él como Señor y Dios, y persigue a los cristianos en sus últimos años."},{"t":"Juan es desterrado a Patmos","d":"Juan recibe las visiones registradas en Apocalipsis."}],"finds":{"Avaris: Asiatics in the Nile Delta":{"t":"Avaris: asiáticos en el delta del Nilo","w":"Tell el-Dab'a, Egipto","d":"Las excavaciones en Avaris encontraron una gran comunidad de colonos cananeos y de otros pueblos semitas en el delta oriental de Egipto, algunos de los cuales llegaron al poder como los hicsos. Esto muestra que gente de Canaán vivía y trabajaba en Egipto en la época de Génesis y Éxodo. Si esto se relaciona con José y los israelitas es un tema debatido."},"Jericho's walls":{"t":"Las murallas de Jericó","w":"Tell es-Sultán, Jericó","d":"Las excavaciones de John Garstang y, más tarde, de Kathleen Kenyon descubrieron fortificaciones enormes y una ciudad incendiada. Kenyon fechó la destrucción hacia 1550 a. C., mucho antes de la fecha bíblica. Otros estudiosos defienden una cronología revisada, así que la cuestión sigue abierta."},"The Amarna Letters":{"t":"Las cartas de Amarna","w":"Tell el-Amarna, Egipto (hallado en 1887)","d":"En tablillas de arcilla, gobernantes cananeos, entre ellos el rey de Jerusalén, escriben al faraón sobre las amenazas de grupos de merodeadores llamados los habiru. Ofrecen una imagen de las ciudades-estado de Canaán en los años cercanos a la época de Josué y Jueces."},"The Merneptah Stele":{"t":"La estela de Merneptah","w":"Tebas, Egipto (hallada en 1896); Museo Egipcio, El Cairo","d":"Un himno de victoria del faraón Merneptah menciona a Israel entre los pueblos que derrotó en Canaán. Es la mención más antigua que se conoce de Israel fuera de la Biblia y muestra que Israel era un pueblo identificable en la tierra hacia 1208 a. C."},"The Philistines on the Medinet Habu reliefs":{"t":"Los filisteos en los relieves de Medinet Habu","w":"Templo de Ramsés III, Egipto; excavaciones en Ascalón, Ecrón y Gat","d":"Los relieves muestran a Ramsés III luchando contra los Pueblos del Mar, entre ellos los peleset, que generalmente se identifican con los filisteos. Las excavaciones en ciudades filisteas han hallado cerámica, arquitectura y costumbres distintivas que concuerdan con un pueblo venido del mundo egeo."},"Khirbet Qeiyafa":{"t":"Khirbet Qeiyafa","w":"Valle de Ela, Israel","d":"Una ciudad muy fortificada en el camino entre Filistea y Jerusalén, fechada por sus excavadores hacia 1000 a. C., la época de David. Ellos la vinculan con el Judá primitivo. Otros sostienen que pertenecía a otro pueblo o que era un centro de culto, por lo que su significado es discutido."},"Gates at Hazor, Megiddo and Gezer":{"t":"Las puertas de Hazor, Meguido y Gezer","w":"Hazor, Meguido y Gezer, Israel","d":"Puertas de seis cámaras casi idénticas en tres ciudades fueron relacionadas por Yigael Yadin con 1 Reyes 9:15, donde Salomón fortifica estas ciudades. Su fecha y sus constructores todavía se debaten, pero muestran una construcción real a gran escala en los años 900 a. C. o poco después."},"Shishak's list at Karnak":{"t":"La lista de Sisac en Karnak","w":"Portal Bubastita, templo de Karnak, Egipto","d":"El faraón Sheshonq I (Sisac) grabó en el muro de un templo una lista de las ciudades que conquistó. Respalda la campaña de 1 Reyes 14:25 en los días de Roboam, aunque la lista que se conserva no nombra a Jerusalén."},"The Kurkh Monolith":{"t":"El monolito de Kurkh","w":"Kurkh, Turquía (hallado en 1861); Museo Británico","d":"Salmanasar III de Asiria registra la batalla de Qarqar y enumera a Acab el israelita entre sus enemigos, con 2000 carros y 10 000 soldados. Es uno de los registros más antiguos de un rey israelita fuera de la Biblia."},"The Mesha Stele (Moabite Stone)":{"t":"La estela de Mesa (Piedra Moabita)","w":"Dibán, Jordania (hallada en 1868); Louvre","d":"El rey Mesa de Moab cuenta cómo Omri, rey de Israel, oprimió a Moab y cómo Moab recuperó su tierra. Nombra al SEÑOR (Yahveh) y concuerda con el trasfondo de 2 Reyes 3."},"The Black Obelisk of Shalmaneser III":{"t":"El Obelisco Negro de Salmanasar III","w":"Nimrud, Irak (hallado en 1846); Museo Británico","d":"Un panel tallado muestra a Jehú, llamado hijo de Omri (los asirios usaban esa expresión para los reyes de Israel), inclinándose con tributo ante el rey asirio. Es la única imagen conocida de un rey israelita hecha en su propia época."},"The Tel Dan Stele":{"t":"La estela de Tel Dan","w":"Tel Dan, norte de Israel (hallada en 1993–94); Museo de Israel","d":"Un rey arameo se jacta de haber derrotado a los reyes de Israel y a la casa de David. La mayoría de los estudiosos lo leen como la primera mención de la dinastía de David fuera de la Biblia, aunque unos pocos cuestionan esa lectura."},"The Siloam Tunnel inscription":{"t":"La inscripción del túnel de Siloé","w":"Jerusalén (hallada en 1880); Museos Arqueológicos de Estambul","d":"Grabada dentro del túnel de Ezequías, una inscripción en hebreo describe cómo dos equipos de obreros se encontraron a mitad de camino mientras abrían la roca. Concuerda con la obra de agua de 2 Reyes 20:20 y 2 Crónicas 32:30."},"Seal impression of King Hezekiah":{"t":"Impresión de sello del rey Ezequías","w":"Excavaciones de Ofel, Jerusalén (anunciada en 2015)","d":"Una impresión de sello en arcilla dice: Perteneciente a Ezequías, [hijo de] Acaz, rey de Judá. Fue hallada entre los escombros del Ofel, justo al sur del monte del Templo, y es un registro físico directo de un rey bíblico."},"Sennacherib's Prism and the Lachish reliefs":{"t":"El prisma de Senaquerib y los relieves de Laquis","w":"Nínive, Irak; Museo Británico","d":"El prisma de Taylor de Senaquerib dice que encerró a Ezequías en Jerusalén como a un pájaro en una jaula, y los relieves de su palacio muestran a su ejército tomando Laquis. Junto con la Biblia, ofrecen relatos de la misma campaña desde ambos lados."},"The Ketef Hinnom silver scrolls":{"t":"Los rollos de plata de Ketef Hinom","w":"Cueva funeraria cerca de Jerusalén (hallados en 1979); Museo de Israel","d":"Dos diminutos amuletos de plata llevan inscritas palabras que coinciden con la bendición sacerdotal de Números 6:24–26. Están entre los fragmentos más antiguos que se conocen de texto bíblico, de alrededor de 600 a. C."},"The Babylonian Chronicle":{"t":"La Crónica Babilónica","w":"Babilonia; Museo Británico","d":"Un registro babilónico cuenta cómo Nabucodonosor capturó la ciudad de Judá en 597 a. C. y puso a un rey de su elección. Concuerda con 2 Reyes 24, donde Joaquín es deportado y Sedequías es hecho rey."},"Tablets from a Judean exile village":{"t":"Tablillas de una aldea de exiliados judíos","w":"Babilonia (las tablillas de Al-Yahudu)","d":"Tablillas de arcilla de una aldea llamada Ciudad de Judá enumeran a personas con nombres hebreos que vivían en Babilonia durante el exilio y después de él. Muestran cómo vivían, cultivaban y hacían negocios los judíos exiliados."},"Nabonidus and Belshazzar":{"t":"Nabónido y Belsasar","w":"Textos babilónicos","d":"Los registros babilónicos muestran que el rey Nabónido pasó años en Arabia mientras su hijo Belsasar gobernaba en Babilonia. Eso ayuda a explicar por qué Daniel 5 presenta a Belsasar como el gobernante de la ciudad cuando cayó."},"The Cyrus Cylinder":{"t":"El cilindro de Ciro","w":"Babilonia (hallado en 1879); Museo Británico","d":"Ciro el Grande registra su conquista de Babilonia y su política de devolver a los pueblos desplazados y a sus dioses a sus tierras de origen. No nombra a los judíos, pero concuerda con el decreto descrito en Esdras 1."},"The Dead Sea Scrolls":{"t":"Los rollos del mar Muerto","w":"Cuevas cerca de Qumrán (hallados en 1947–56); Museo de Israel","d":"Cientos de manuscritos incluyen porciones de casi todos los libros del Antiguo Testamento, además del Gran Rollo de Isaías, casi completo. Son unos mil años más antiguos que los manuscritos hebreos más antiguos conocidos hasta entonces, y muestran que el texto se copió con gran cuidado."},"Herod's Temple Mount":{"t":"El monte del Templo de Herodes","w":"Jerusalén","d":"Herodes amplió la plataforma del Templo con enormes muros de contención. El Muro Occidental y los adoquines cercanos aún se conservan y muestran la magnitud del complejo del Templo que Jesús conoció."},"Herod's tomb at Herodium":{"t":"La tumba de Herodes en el Herodión","w":"El Herodión, cerca de Belén (hallada en 2007)","d":"El arqueólogo Ehud Netzer identificó la tumba de Herodes el Grande en el palacio-fortaleza que construyó al sur de Jerusalén. El rey de Mateo 2 dejó monumentos por toda la tierra."},"The Pool of Bethesda":{"t":"El estanque de Betesda","w":"Jerusalén, cerca de la zona de la Puerta de las Ovejas","d":"Las excavaciones revelaron un gran estanque doble con pórticos de columnas, lo que concuerda con la descripción de Juan de un estanque con cinco pórticos donde Jesús sanó a un hombre."},"The Pool of Siloam":{"t":"El estanque de Siloé","w":"Jerusalén (hallado en 2004)","d":"Unos obreros que reparaban una tubería de desagüe encontraron estanques escalonados al sur del monte del Templo que corresponden al estanque de Siloé, adonde Jesús envió a un ciego a lavarse (Juan 9). Los estudiosos aún discuten detalles de su diseño y su fecha."},"The Caiaphas ossuary":{"t":"El osario de Caifás","w":"Cueva funeraria en Jerusalén (hallado en 1990)","d":"Una caja de huesos decorada, con la inscripción José hijo de Caifás, provino de una elaborada tumba familiar. Muchos estudiosos piensan que perteneció al sumo sacerdote que presidió el juicio de Jesús, aunque no todos están de acuerdo."},"The crucified man of Giv'at ha-Mivtar":{"t":"El crucificado de Giv'at ha-Mivtar","w":"Jerusalén (hallado en 1968)","d":"El hueso del talón de un hombre llamado Yehohanán todavía tenía un clavo de hierro, una rara evidencia esquelética de la crucifixión romana en Judea. Muestra cómo se practicaba en los días de Jesús."},"The Pilate Stone":{"t":"La piedra de Pilato","w":"Cesarea Marítima (hallada en 1961); Museo de Israel","d":"Un bloque de piedra caliza con el nombre de Poncio Pilato como prefecto de Judea. Es la inscripción más conocida que nombra al gobernador que condenó a Jesús."},"The Gallio inscription":{"t":"La inscripción de Galión","w":"Delfos, Grecia","d":"Una carta del emperador Claudio grabada en Delfos nombra a Galión como procónsul de Acaya. Como los años de su gobierno pueden fecharse, ayuda a precisar cuándo estuvo Pablo en Corinto (Hechos 18:12)."},"The theater at Ephesus":{"t":"El teatro de Éfeso","w":"Éfeso, Turquía","d":"El gran teatro, con capacidad para unas 24 000 personas, es el escenario del tumulto de Hechos 19. Del templo de Artemisa, cuyos plateros se opusieron a Pablo, solo quedan los cimientos."},"The Erastus pavement":{"t":"El pavimento de Erasto","w":"Corinto, Grecia","d":"Una losa de pavimento registra que Erasto la colocó a sus expensas a cambio de un cargo en la ciudad. Algunos lo relacionan con el Erasto que envía saludos en Romanos 16:23. La identificación es incierta porque el nombre era común."},"The Arch of Titus":{"t":"El Arco de Tito","w":"Roma","d":"Un relieve del arco muestra a soldados romanos llevando la menorá del Templo en un triunfo tras la caída de Jerusalén en el año 70 d. C. Es un registro romano de la destrucción que Jesús anunció."}},"eras":{"prim":{"n":"Los comienzos","r":"Sin fecha","b":"La creación, la caída, el diluvio y Babel. Las Escrituras los presentan sin fechas de calendario."},"back":{"n":"El mundo antiguo","r":"c. 3100–2100 a. C.","b":"Antes de Abraham: los faraones de Egipto, las pirámides y los primeros imperios de Mesopotamia."},"pat":{"n":"Los patriarcas y Egipto","r":"c. 2100–1446 a. C.","b":"Abraham, Isaac, Jacob y José; Israel crece hasta ser una nación en Egipto."},"exo":{"n":"El Éxodo y el desierto","r":"1446–1406 a. C.","b":"La Pascua, el Sinaí y cuarenta años de peregrinación."},"con":{"n":"La conquista y los jueces","r":"1406–1050 a. C.","b":"Josué entra en la tierra, y las tribus pasan una y otra vez del pecado al rescate."},"uni":{"n":"El reino unido","r":"1050–931 a. C.","b":"Saúl, David y Salomón: la monarquía de Israel en su apogeo."},"div":{"n":"El reino dividido","r":"931–586 a. C.","b":"Israel y Judá se separan, los profetas advierten, y Asiria y Babilonia conquistan."},"exl":{"n":"Exilio y regreso","r":"586–400 a. C.","b":"Babilonia, Persia, y la reconstrucción del Templo y de los muros."},"int":{"n":"Entre los Testamentos","r":"c. 400–6 a. C.","b":"Griegos, macabeos y Roma: el mundo es preparado para el Mesías."},"chr":{"n":"La vida de Cristo","r":"c. 6 a. C.–30 d. C.","b":"Nacimiento en Belén, ministerio en Galilea y Judea, cruz y tumba vacía."},"chu":{"n":"La Iglesia primitiva","r":"30–100 d. C.","b":"Pentecostés, los viajes de Pablo, las persecuciones de Roma y la caída de Jerusalén."}},"hublm":["Abraham es llamado","El éxodo","David es rey","Se inicia el Templo","El reino se divide","Cae Samaria","Cae Jerusalén","Comienza el regreso","Revuelta macabea","Nace Jesús","Cruz y resurrección","Concilio de Jerusalén","El Templo es destruido"],"maps":{"abraham":{"t":"El viaje de Abraham","sub":"De Ur a Canaán, y de ida y vuelta a Egipto","era":"Patriarcas","s":["La familia de Abraham sale de Ur de los caldeos rumbo a Canaán (Génesis 11:31).","Se establecen en Harán, donde muere Taré. Dios llama a Abram para que parta (12:1).","Abram entra en Canaán y construye un altar en Siquem. Dios promete esta tierra a su descendencia (12:6–7).","Acampa entre Betel y Hai e invoca el nombre del SEÑOR.","Una hambruna lo lleva hacia Egipto (12:10). No se nombran la ruta ni el lugar, así que Menfis representa a Egipto.","De regreso en Canaán, se establece junto a las encinas de Mamre, cerca de Hebrón (13:18).","Más tarde Isaac vive por los alrededores de Beerseba, donde Abraham plantó un tamarisco (21:33)."]},"exodus":{"t":"El Éxodo y el desierto","sub":"De Egipto a las llanuras de Moab","era":"Éxodo","s":["Los israelitas salen de Ramsés, en el delta oriental de Egipto (Éxodo 12:37).","Primer campamento en Sucot. Se debate por dónde cruzó Israel el mar, y se proponen varias rutas.","En el monte Sinaí Israel recibe el pacto y la ley, y construye el tabernáculo (Éxodo 19–40). El sitio tradicional es el Jebel Musa, pero algunos proponen otras montañas.","Desde Cades-barnea se envía a los espías a Canaán, y el pueblo se niega a entrar (Números 13–14).","La ruta hacia Edom y Moab pasa por la zona cercana a Ezión-geber (Números 33:35).","Moisés contempla la tierra desde el monte Nebo y muere allí (Deuteronomio 34)."]},"conquest":{"t":"La conquista de Canaán","sub":"Las campañas de Josué","era":"Conquista","s":["Israel cruza el Jordán y toma Jericó (Josué 3–6).","Tras una derrota por el pecado de Acán, cae Hai (Josué 7–8). La ubicación de Hai es debatida.","Israel renueva el pacto en el monte Ebal y el monte Gerizim, junto a Siquem (8:30–35).","Los gabaonitas engañan a Josué para lograr un tratado, y él los defiende en una batalla en la que el sol se detiene (Josué 9–10).","La campaña del sur toma Laquis, Hebrón y otras ciudades (10:31–39).","En el norte Josué derrota a la coalición de Hazor y quema la ciudad (11:10–11).","El tabernáculo se instala en Silo y la tierra se reparte entre las tribus (Josué 18)."]},"david":{"t":"Jueces, Saúl y David","sub":"De Silo a la Ciudad de David","era":"Monarquía temprana","s":["El arca y el tabernáculo están en Silo. Ana ora allí, y Samuel se cría en la casa del SEÑOR (1 Samuel 1–3).","Los filisteos capturan el arca y la llevan a Asdod, luego a Gat y a Ecrón (1 Samuel 5).","Saúl, de Guibeá de Benjamín, es ungido rey (1 Samuel 9–10).","Samuel unge a David, el hijo menor de Isaí, en Belén (1 Samuel 16).","David derrota a Goliat de Gat en el valle de Ela (1 Samuel 17).","Saúl y Jonatán mueren en el monte Gilboa luchando contra los filisteos (1 Samuel 31).","David es hecho rey de Judá en Hebrón, y reina allí siete años y medio (2 Samuel 2:11).","Toma Jerusalén y la hace su capital (2 Samuel 5:6–9)."]},"empires":{"t":"Reinos, exilio y regreso","sub":"Asiria, Babilonia y el camino a casa","era":"Del reino dividido al regreso","s":["Asiria conquista Samaria en 722 a. C. y deporta a muchos israelitas (2 Reyes 17).","En 701 a. C. Senaquerib toma Laquis y amenaza a Jerusalén. La ciudad se salva (2 Reyes 18–19).","Babilonia derrota a Egipto en Carquemis en 605 a. C. y se convierte en la potencia dominante (Jeremías 46:2).","El cuartel general de Nabucodonosor en Riblá es donde Sedequías recibe su sentencia (2 Reyes 25:6).","Jerusalén cae y el Templo es quemado en 586 a. C. (2 Reyes 25).","Muchos judíos son llevados a Babilonia, donde Daniel, Ezequiel y otros sirven y profetizan.","Persia toma el poder. Ciro permite que los exiliados regresen en 538 a. C. (Esdras 1). Más tarde Nehemías sirve al rey en Susa (Nehemías 1)."]},"prophets":{"t":"Los profetas y sus lugares","sub":"Dónde vivieron y hablaron los profetas","era":"Profetas","s":["Isaías sirve en Jerusalén bajo cuatro reyes de Judá (Isaías 1:1).","Amós, un pastor de Tecoa, es enviado al norte, a Betel (Amós 1:1; 7:10–15).","Oseas y Amós hablan al reino del norte, cuya capital es Samaria.","Jonás se embarca en Jope tratando de huir del SEÑOR (Jonás 1:3). Tarsis queda muy al oeste, fuera de este mapa.","Jonás es enviado a predicar en Nínive, la capital asiria (Jonás 3).","Jeremías es de Anatot, un pueblo de sacerdotes justo al norte de Jerusalén (Jeremías 1:1).","Después de la caída de Jerusalén, Jeremías es llevado a Egipto, y Tafnes se nombra en Jeremías 43:7.","Ezequiel profetiza a los exiliados en Babilonia, junto al canal del Quebar (Ezequiel 1:1)."]},"jesus":{"t":"El ministerio de Jesús","sub":"Belén, Galilea y el camino a Jerusalén","era":"Evangelios","s":["Jesús nace en Belén (Lucas 2:1–7; Mateo 2:1).","Crece en Nazaret de Galilea (Lucas 2:39–40, 51–52).","Juan bautiza a Jesús en el Jordán (Marcos 1:9–11). El sitio exacto es debatido.","En una boda en Caná convierte el agua en vino (Juan 2:1–11). La ubicación de Caná es debatida.","Establece su base en Capernaúm y enseña en la sinagoga (Marcos 1:21; Mateo 4:13).","Cerca de Cesarea de Filipo, Pedro confiesa a Jesús como el Cristo (Marcos 8:27–30).","En Samaria habla con una mujer junto al pozo de Jacob en Sicar (Juan 4).","En el camino de subida a Jerusalén sana al ciego Bartimeo y conoce a Zaqueo en Jericó (Lucas 18–19).","En Betania resucita a Lázaro (Juan 11).","Jesús entra en Jerusalén para la última Pascua."]},"passion":{"t":"La Semana Santa en Jerusalén","sub":"Del Domingo de Ramos a la tumba vacía","era":"Evangelios","s":["Jesús sale de Betania y cabalga hacia la ciudad (Marcos 11:1).","Por el monte de los Olivos entra en Jerusalén, y las multitudes lo reciben (Mateo 21:1–11).","Enseña en el Templo y expulsa a los cambistas (Marcos 11:15–17).","Come la Pascua con sus discípulos en un aposento alto (Lucas 22:12). El sitio tradicional está en el monte Sión.","Ora en Getsemaní y es arrestado (Marcos 14:32–50).","Es llevado ante Pilato. El lugar del juicio, la Antonia o el palacio de Herodes, es debatido (Juan 18–19).","Es crucificado en el Gólgota y puesto en una tumba cercana (Juan 19:17–42). La tradición ubica ambos bajo la Iglesia del Santo Sepulcro. Algunos estudiosos prefieren otros sitios."]},"paul1":{"t":"El primer viaje de Pablo","sub":"Hechos 13–14","era":"Hechos","s":["La iglesia de Antioquía envía a Bernabé y a Saulo (Hechos 13:1–3).","Predican en las sinagogas de Salamina, en Chipre.","En Pafos cree el procónsul Sergio Paulo (13:6–12).","Navegan a Perge, y Juan Marcos regresa a Jerusalén (13:13).","En Antioquía de Pisidia Pablo predica en la sinagoga y luego se vuelve a los gentiles (13:14–48).","Son expulsados de Iconio.","En Listra Pablo sana a un cojo y es apedreado (14:8–20).","Hacen muchos discípulos en Derbe, luego regresan sobre sus pasos y nombran ancianos (14:20–23).","Vuelven a Antioquía e informan que Dios había abierto a los gentiles la puerta de la fe (14:27)."]},"paul2":{"t":"El segundo viaje de Pablo","sub":"Hechos 15:36–18:22","era":"Hechos","s":["Pablo y Silas parten de Antioquía.","En Listra suman a Timoteo al equipo (Hechos 16:1–3).","En Troas Pablo tiene una visión de un hombre de Macedonia que pide ayuda (16:9).","En Filipos cree Lidia, y Pablo y Silas son encarcelados y liberados (16:11–40).","Predican en Tesalónica hasta que una turba los obliga a irse (17:1–9).","Los de Berea examinan las Escrituras cada día (17:10–12).","Pablo habla ante el Areópago en Atenas (17:16–34).","Permanece 18 meses en Corinto (18:1–18).","Se detiene brevemente en Éfeso y promete volver (18:19–21).","Navega a Cesarea, saluda a la iglesia de Jerusalén y regresa a Antioquía (18:22)."]},"paul3":{"t":"El tercer viaje de Pablo","sub":"Hechos 18:23–21:17","era":"Hechos","s":["Pablo permanece unos tres años en Éfeso, enseñando a diario en la escuela de Tirano (Hechos 19:8–10; 20:31).","Viaja por Macedonia, animando a las iglesias (20:1–2).","Pasa tres meses en Grecia y desde allí escribe Romanos (20:2–3).","En Troas Eutico cae de una ventana y es revivido (20:7–12).","En Mileto llama a los ancianos de Éfeso para reunirse con él y se despide (20:17–38).","En Tiro los discípulos le ruegan que no vaya a Jerusalén (21:3–6).","En Cesarea Agabo advierte a Pablo que será atado en Jerusalén (21:8–14).","Llega a Jerusalén, donde será arrestado (21:15–17, 27–36)."]},"rome":{"t":"El viaje de Pablo a Roma","sub":"Hechos 27–28","era":"Hechos","s":["Pablo es enviado a Roma como prisionero tras apelar al César (Hechos 25:11; 27:1).","El barco hace escala en Sidón, donde Julio permite que Pablo visite a sus amigos (27:3).","En Mira cambian a una nave alejandrina rumbo a Italia (27:5–6).","En Buenos Puertos, en Creta, Pablo advierte que no sigan navegando, pero la nave zarpa de todos modos (27:8–12).","Una tormenta arrastra la nave durante 14 días hasta que naufraga en Malta (27:13–28:10). Los 276 a bordo sobreviven.","Siguen navegando por Siracusa y Regio (28:12–13).","En Puteoli encuentran creyentes y se quedan siete días (28:13–14).","Pablo llega a Roma y predica durante dos años bajo custodia (28:16–31)."]},"churches":{"t":"Las siete iglesias","sub":"Apocalipsis 2–3","era":"Apocalipsis","s":["Juan recibe la revelación en la isla de Patmos (Apocalipsis 1:9).","Éfeso tiene arduo trabajo y perseverancia, pero ha perdido su primer amor (2:1–7).","A Esmirna se le dice que no tema el sufrimiento que viene (2:8–11).","Pérgamo es elogiada por mantenerse firme, aunque algunos siguen una falsa enseñanza (2:12–17).","Tiatira es felicitada por su amor y su fe, pero se le advierte acerca de Jezabel (2:18–29).","Sardis tiene fama de estar viva, pero está muerta (3:1–6).","Filadelfia tiene poca fuerza, pero guardó su palabra (3:7–13).","Laodicea es tibia, y se le dice que sea celosa y se arrepienta (3:14–22)."]},"origins":{"t":"El primer mundo","sub":"Génesis 1–11","era":"Los comienzos","s":["Después del diluvio el arca reposa sobre los montes de Ararat (Génesis 8:4). La región de Urartu está en el este de Turquía, y no se nombra el pico exacto.","El reino de Nimrod incluye Nínive (Génesis 10:11).","En Babel, en la tierra de Sinar, la gente construye una torre. Babel se identifica generalmente con Babilonia (11:1–9).","La familia de Abram vive en Ur de los caldeos (11:28).","Se trasladan a Harán (11:31)."]}},"places":{"rameses":"Ramsés","succoth":"Sucot","memphis":"Menfis","thebes":"Tebas","alexandria":"Alejandría","sinai":"Monte Sinaí (sitio tradicional)","kadesh":"Cades-barnea","ezion":"Ezión-geber","tahpanhes":"Tafnes","hebron":"Hebrón","beersheba":"Beerseba","bethel":"Betel","ai":"Hai","shechem":"Siquem","shiloh":"Silo","jericho":"Jericó","gibeon":"Gabaón","jerusalem":"Jerusalén","bethlehem":"Belén","gibeah":"Guibeá","lachish":"Laquis","gath":"Gat","ashkelon":"Ascalón","ashdod":"Asdod","ekron":"Ecrón","gaza":"Gaza","gilboa":"Monte Gilboa","jezreel":"Jezreel","megiddo":"Meguido","carmel":"Monte Carmelo","samaria":"Samaria","dan":"Dan","hazor":"Hazor","tyre":"Tiro","sidon":"Sidón","damascus":"Damasco","caesarea":"Cesarea","joppa":"Jope","ptolemais":"Ptolemaida (Aco)","nazareth":"Nazaret","cana":"Caná","capernaum":"Capernaúm","bethsaida":"Betsaida","caesareaphilippi":"Cesarea de Filipo","sychar":"Sicar","bethany":"Betania","emmaus":"Emaús (un sitio tradicional)","nain":"Naín","hermon":"Monte Hermón","gadara":"Gadara","jordanbap":"Betania al otro lado del Jordán","nebo":"Monte Nebo","heshbon":"Hesbón","dibon":"Dibón (Moab)","tekoa":"Tecoa","anathoth":"Anatot","mizpah":"Mizpa","ramah":"Ramá","qumran":"Qumrán","engedi":"En Gadi","bozrah":"Bosra (Edom)","ur":"Ur","haran":"Harán","babylon":"Babilonia","nineveh":"Nínive","susa":"Susa","ararat":"Montes de Ararat","carchemish":"Carquemis","riblah":"Riblá","antioch":"Antioquía de Siria","seleucia":"Seleucia","tarsus":"Tarso","iconium":"Iconio","lystra":"Listra","derbe":"Derbe","pisidian":"Antioquía de Pisidia","perga":"Perge","attalia": var _snap=null;
function applyLang(l){
  if(!_snap){
    _snap=true;
    BOOKS.forEach(function(b){b.o={a:b.a,wl:b.wl,pl:b.pl,sum:b.sum,ctx:b.ctx,wd:b.wd,ev:b.ev,ref:b.ref};});
    EV.forEach(function(e){e.o={t:e.t,d:e.d,w:e.w};});
    window._EVN=EV.filter(function(e){return e.l!=="a";});
    ERAS.forEach(function(e){e.o={n:e.n,r:e.r,b:e.b};});
    window._HUBEN=HUBLM.map(function(m){return m[1];});
    MAPS.forEach(function(m){m.o={t:m.t,sub:m.sub,era:m.era,s:m.s.map(function(x){return x[1];})};});
    window._MPEN={};Object.keys(MP).forEach(function(k){window._MPEN[k]=MP[k][0];});
    RG.forEach(function(r){r.push(r[0]);});
  }
  LANG=l;var es=l==="es";
  BOOKS.forEach(function(b,i){var t=es?ES.books[i]:null;["a","wl","pl","sum","ctx","wd","ev","ref"].forEach(function(f){b[f]=t?t[f]:b.o[f];});});
  window._EVN.forEach(function(e,i){var t=es?ES.events[i]:null;e.t=t?t.t:e.o.t;e.d=t?t.d:e.o.d;});
  EV.forEach(function(e){if(e.l==="a"){var t=es?ES.finds[e.o.t]:null;e.t=t?t.t:e.o.t;e.w=t?t.w:e.o.w;e.d=t?t.d:e.o.d;}});
  ERAS.forEach(function(e){var t=es?ES.eras[e.id]:null;e.n=t?t.n:e.o.n;e.r=t?t.r:e.o.r;e.b=t?t.b:e.o.b;});
  HUBLM.forEach(function(m,i){m[1]=es?ES.hublm[i]:window._HUBEN[i];});
  MAPS.forEach(function(m){var t=es?ES.maps[m.id]:null;m.t=t?t.t:m.o.t;m.sub=t?t.sub:m.o.sub;m.era=t?t.era:m.o.era;m.s.forEach(function(s,k){s[1]=t?t.s[k]:m.o.s[k];});});
  Object.keys(MP).forEach(function(k){MP[k][0]=es&&ES.places[k]?ES.places[k]:window._MPEN[k];});
  RG.forEach(function(r){r[0]=es&&ES.regions[r[r.length-1]]?ES.regions[r[r.length-1]]:r[r.length-1];});
  try{document.documentElement.setAttribute("lang",l);}catch(e){}
  try{localStorage.setItem("sit-lang",l);}catch(e){}
  applyStatic();
}

}

/* ---------- cards and rows ---------- */
function card(e){
  if(e.l==="a"){return discCard(e);}
  var hl=S.hl&&e.bk.indexOf(S.hl)>-1;
  var chips=e.bk.length?'<div class="chips">'+e.bk.map(function(n){return '<button class="chip" data-book="'+n+'">'+dn(n)+'</button>';}).join("")+"</div>":"";
  return '<article class="card '+(e.l==="b"?"bib":(e.l==="w"?"wld":"dis"))+(hl?" hl":"")+'"><div class="when">'+fmt(e)+"</div><h4>"+e.t+"</h4><p>"+e.d+"</p>"+(e.x?'<span class="tag">'+T("Beyond the biblical narrative")+'</span>':"")+chips+"</article>";
}
function row(e){
  var c=card(e);
  return '<div class="row '+e.l+'"><div class="cell l">'+(e.l==="b"?c:"")+'</div><div class="spine"><i></i><span>'+fmt(e)+'</span></div><div class="cell r">'+(e.l!=="b"?c:"")+"</div></div>";
}
function laneHead(){return '<div class="lanehead"><span>'+T("Bible and Israel")+'</span><span></span><span>'+T("World history and discoveries")+'</span></div>';}

/* ---------- book view ---------- */
function miniEvents(b){
  var s0=b.sp[0],s1=b.sp[1];
  function within(p){return EV.filter(function(e){return e.l!=="a"&&e.y>-99999&&e.y>=s0-p&&e.y<=s1+p;});}
  var pad=15,pool=within(pad);
  while(pool.length<4&&pad<500){pad*=2;pool=within(pad);}
  if(pool.length>12){
    var f=pool.filter(function(e){return e.bk.indexOf(b.n)>-1;});
    if(f.length>=4){pool=f;}else{pool=within(6);}
  }
  if(b.n==="Genesis"){pool=EV.filter(function(e){return e.y<=-99999;}).concat(pool);}
  return pool;
}
function bookView(b){
  var sec=SECMAP[b.s],prev=BOOKS[b.i-1],next=BOOKS[b.i+1];
  var pool=miniEvents(b);
  var digs=EV.filter(function(e){return e.l==="a"&&e.bk.indexOf(b.n)>-1;});
  var digHtml=digs.length?'<section class="digs"><h2>'+T("What archaeology has found")+'</h2><p class="sub">'+T("Discoveries connected to {b}. Links go to the Biblical Archaeology Society.",{b:dn(b.n)})+'</p><div class="finds">'+digs.map(card).join("")+"</div></section>":"";
  var items=pool.map(function(e){return {y:e.y,e:e};});
  var ys=pool.filter(function(e){return e.y>-99999;}).map(function(e){return e.y;});
  if(ys.length){
    var lo=Math.min.apply(null,ys)-30,hi=Math.max.apply(null,ys)+30;
    if(b.wy>=lo&&b.wy<=hi){items.push({y:b.wy+0.001,mk:true});}
  }
  items.sort(function(a,c){return a.y-c.y;});
  var limit=S.more?items.length:10;
  var rows=items.slice(0,limit).map(function(it){
    if(it.mk){return '<div class="marker"><div class="mk">'+T("{b} is written about here ({w})",{b:dn(b.n),w:b.wl})+'</div></div>';}
    return row(it.e);
  }).join("");
  var more=items.length>limit?'<button class="more" data-more="1">'+T("Show {n} more events",{n:items.length-limit})+'</button>':"";
  var facts=[[T("Author"),b.a],[T("Written"),b.wl],[T("Setting"),b.pl],[T("Chapters"),String(b.c)]].map(function(f){return "<div><dt>"+f[0]+"</dt><dd>"+f[1]+"</dd></div>";}).join("");
  var evs=b.ev.map(function(t){return "<li><span>"+t+"</span></li>";}).join("");
  return '<article>'
   +'<button class="back" data-view="home">&#8592; '+T("All books on the timeline")+'</button>'
   +'<div class="hero"><div class="pill"><span class="sw" style="background:'+sec.c+'"></span>'+T(sec.t==="OT"?"Old Testament":"New Testament")+" · "+sn(b.s)+"</div><h1>"+dn(b.n)+"</h1>"+origHtml(b)+'<p class="lead">'+b.sum+"</p>"

/* ---------- timeline view ---------- */

/* ---------- finds: archaeology and the Bible ---------- */

  });

 [-538,"Return begins",1],[-167,"Maccabean revolt",1],[-5,"Jesus is born"],[30,"Cross and resurrection"],[49,"Council at Jerusalem"],[70,"Temple destroyed",1]];
function anchorOf(b){return ANCH[b.n]!==undefined?ANCH[b.n]:(b.sp[0]+b.sp[1])/2;}
function hubEra(y){for(var i=0;i<HUBERAS.length;i++){if(y>=HUBERAS[i].s&&y<HUBERAS[i].e)return HUBERAS[i];}return y<HUBERAS[0].s?HUBERAS[0]:HUBERAS[HUBERAS.length-1];}
function pack(items,gap){var ends=[];items.sort(function(a,b){return a.l-b.l;});items.forEach(function(it){var r=0;while(ends[r]!==undefined&&ends[r]+gap>it.l){r++;}it.row=r;ends[r]=it.l+it.w;});return ends.length;}
function hubLayout(){
  var cnt={},x=40;
  BOOKS.forEach(function(b){var h=hubEra(anchorOf(b));cnt[h.id]=(cnt[h.id]||0)+1;});
  HUBERAS.forEach(function(h){h.w=h.gap?240:Math.max(220,(cnt[h.id]||0)*62);h.x=x;x+=h.w;});
  function xOf(y){var h=hubEra(y),t=(y-h.s)/(h.e-h.s);t=Math.max(0,Math.min(1,t));return h.x+(0.05+0.9*t)*h.w;}
  var chips=BOOKS.map(function(b){var cx=xOf(anchorOf(b)),w=Math.round(dn(b.n).length*7.6+34);return {b:b,x:cx,w:w,l:Math.max(6,cx-w/2)};});
  var rows=pack(chips,8);
  var lms=HUBLM.map(function(m){var cx=xOf(m[0]),txt=m[1]+" · "+fmtY(m[0],!!m[2]);return {y:m[0],x:cx,txt:txt,w:Math.round(txt.length*7.2+18),l:cx-2};});
  var lmRows=pack(lms,10);
  return {total:x+40,chips:chips,rows:rows,lms:lms,lmRows:lmRows};
}
function hubDetail(n){

  var ex=b.ctx.split(/(?<=[.!?])\s+/).slice(0,2).join(" ");
  var near=BOOKS.filter(function(o){return o!==b&&hubEra(anchorOf(o))===h;}).sort(function(p,q){return Math.abs(anchorOf(p)-anchorOf(b))-Math.abs(anchorOf(q)-anchorOf(b));}).slice(0,8);
