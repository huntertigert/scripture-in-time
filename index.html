    labels+='<text x="'+mr(ax)+'" y="'+mr(placed.b[1]+hh*0.78)+'" text-anchor="'+placed.a[2]+'" font-size="'+mr(fs)+'" class="mlbl'+(c.p.sel?" sel":"")+(c.find?" fnd":"")+'" stroke-width="'+mr(3*u)+'">'+mesc(nm)+'</text>';
  });
  var regs="";
  // regions
  RG.forEach(function(r){
    if(lonSpan<r[3]||lonSpan>=r[4])return;
    var x=mpx(r[2]),y=mpy(r[1]);if(!inView(x,y,20*u))return;
    var fs=(lonSpan>12?10.5:9.5)*u,t=r[0],ls=fs*0.28,w=t.length*(fs*0.62+ls);
    if(hit([x-w/2,y-fs,x+w/2,y+fs*0.3])||x-w/2<vb.x+2*u||x+w/2>vb.x+vb.w-2*u)return;
    regs+='<text x="'+mr(x)+'" y="'+mr(y)+'" text-anchor="middle" font-size="'+mr(fs)+'" letter-spacing="'+mr(ls)+'" class="mreg">'+t+'</text>';
    addBox([x-w/2,y-fs,x+w/2,y+fs*0.3]);
  });
  h=h.replace('<!--REGS-->',regs);
  h+=labels;
  pins.sort(function(a,b){return (a.p.sel?1:0)-(b.p.sel?1:0)||(a.find?1:0)-(b.find?1:0);});
  pins.forEach(function(c){
    var p=c.p,at=p.data?' '+p.data+' tabindex="0" role="button" aria-label="'+mesc(c.name)+'" class="mpin"':' class="mpin st"';
    var r=(p.sel?7.2:rad)*1,sr=r;
    h+='<g'+at+' transform="translate('+mr(c.x)+" "+mr(c.y)+')">';
    if(p.sel){h+='<circle r="'+mr(r+4*u)+'" fill="none" stroke="var(--gold)" stroke-width="'+mr(2*u)+'"/>';}
    if(c.find){var s=(p.cnt>1?6.4:(p.sel?6.2:4.6))*u;h+='<path d="M0 '+mr(-s*1.25)+"L"+mr(s*1.1)+" 0L0 "+mr(s*1.25)+"L"+mr(-s*1.1)+' 0Z" fill="var(--dig)" stroke="var(--pin-edge)" stroke-width="'+mr(1.2*u)+'"/>';if(p.cnt>1){h+='<text y="'+mr(s*0.4)+'" text-anchor="middle" font-size="'+mr(s*1.2)+'" class="mnum" fill="var(--paper)">'+p.cnt+'</text>';}}
    else if(p.num!==undefined){var rr=(p.sel?7.8:6.4)*u;h+='<circle r="'+mr(rr)+'" fill="'+(c.unc?"var(--paper)":"var(--rubric)")+'" stroke="'+(c.unc?"var(--rubric)":"var(--pin-edge)")+'" stroke-width="'+mr(1.4*u)+'"/><text y="'+mr(rr*0.36)+'" text-anchor="middle" font-size="'+mr(rr*1.15)+'" class="mnum" fill="'+(c.unc?"var(--rubric)":"var(--paper)")+'">'+p.num+'</text>';}
    else{var d2=(p.sel?6:3.6)*u;h+='<circle r="'+mr(d2)+'" fill="'+(c.unc?"var(--paper)":(p.alt?"var(--muted)":"var(--rubric)"))+'" stroke="'+(c.unc?"var(--rubric)":"var(--pin-edge)")+'" stroke-width="'+mr(1.2*u)+'"/>';}
    h+='<circle r="'+mr(11*u)+'" fill="#000" fill-opacity="0"/></g>';
  });
  return h+'</svg>';
}

/* ---------- maps: views ---------- */
var BYPLACE=null;
function booksAt(id){
  if(!BYPLACE){BYPLACE={};Object.keys(BP).forEach(function(b){BP[b].forEach(function(p){(BYPLACE[p]=BYPLACE[p]||[]).push(b);});});}
  return BYPLACE[id]||[];
}
function mapPxw(kind){var w=(typeof window!=="undefined"&&window.innerWidth)?window.innerWidth:400;
  if(w<=860)return Math.max(300,w-32);
  return kind==="maps"?Math.max(380,Math.min(700,(Math.min(w,1180)-100)*0.6)):Math.max(380,Math.min(760,w-400));}
var MAPBYID={};MAPS.forEach(function(m){MAPBYID[m.id]=m;});
function journeyPins(m,selStep,anim){
  var seen={},pins=[],i;
  m.s.forEach(function(st,k){if(!seen[st[0]]){seen[st[0]]={num:k+1,sel:selStep===k};}else if(selStep===k){seen[st[0]].sel=true;}});
  Object.keys(seen).forEach(function(id){
    var sidx=seen[id].num-1;
    pins.push({id:id,num:seen[id].num,sel:seen[id].sel,pri:50,data:'data-step="'+sidx+'"'});
  });
  var inRoute={};m.routes.forEach(function(r){r.pts.forEach(function(p){if(typeof p==="string")inRoute[p]=1;});});
  Object.keys(inRoute).concat(m.pins||[]).forEach(function(id){if(!seen[id]&&!pins.some(function(x){return x.id===id;})){pins.push({id:id,pri:10,alt:1});}});
  return pins;
}
function mapsView(){
  var m=MAPBYID[S.map]||MAPS[0];
  if(S.map!==m.id)S.map=m.id;
  var sel=S.mapSel;if(sel!==null&&(sel<0||sel>=m.s.length))sel=S.mapSel=null;
  var eras=[],byEra={};MAPS.forEach(function(x){if(!byEra[x.era]){byEra[x.era]=[];eras.push(x.era);}byEra[x.era].push(x);});
  var chips=MAPS.map(function(x){return '<button class="mchip" data-map="'+x.id+'" aria-pressed="'+(x.id===m.id)+'"><small>'+mesc(x.era)+'</small>'+mesc(x.t)+'</button>';}).join("");
  var svg=mapSvg({view:m.view,ps:m.ps,aspect:1.35,pxw:mapPxw("maps"),routes:m.routes,pins:journeyPins(m,sel),anim:S.mapAnim,label:T("{t} map",{t:m.t})});
  var steps=m.s.map(function(st,k){
    var q=MP[st[0]],on=k===sel;
    return '<li><button class="mstep'+(on?" on":"")+'" data-step="'+k+'" aria-pressed="'+on+'"><span class="mn'+(q[4]?" unc":"")+'">'+(k+1)+'</span><span class="mt"><b>'+mesc(q[0])+'</b>'+(q[4]?' <em class="mu">'+T("debated or approximate")+'</em>':"")+'<span class="md">'+mesc(st[1])+'</span></span></button></li>';
  }).join("");
  var cap;
  if(sel===null){cap='<p class="mhint">'+T("Tap a numbered stop on the map, or a step in the list, to see what happens there.")+'</p>';}
  else{
    var cq=MP[m.s[sel][0]],cb=booksAt(m.s[sel][0]).slice(0,10);
    cap='<div class="mcard"><b><span class="mn">'+(sel+1)+'</span>'+mesc(cq[0])+'</b>'+(cq[4]?' <em class="mu">'+T("location debated or approximate")+'</em>':"")+'<p>'+mesc(m.s[sel][1])+'</p>'
      +(cb.length?'<div class="mbk"><small>'+T("Places like this in")+'</small>'+cb.map(function(b){return '<button class="chip" data-book="'+mesc(b)+'">'+mesc(dn(b))+'</button>';}).join("")+'</div>':"")+'</div>';
  }
  var legend='<div class="mleg"><span><i class="lp"></i>'+T("Stop in order")+'</span><span><i class="lp hol"></i>'+T("Debated or approximate")+'</span><span><i class="ld"></i>'+T("Other place")+'</span>'
    +(m.routes.some(function(r){return r.d;})?'<span><i class="ll"></i>'+T("Return or later leg")+'</span>':"")+'</div>';
  var bks=m.books.map(function(b){return '<button class="chip" data-book="'+mesc(b)+'">'+mesc(dn(b))+'</button>';}).join("");
  return '<article class="maps">'
   +'<div class="hubhead"><h1>'+T("Maps")+'</h1><p class="lead">'+T("Follow the journeys of the Bible across the ancient world. Pick a map, then tap a stop to read what happens there.")+'</p></div>'
   +'<div class="mchips" role="group" aria-label="'+T("Choose a map")+'">'+chips+'</div>'
   +'<div class="mgrid"><div class="mcol"><figure class="mfig">'+svg+'</figure><div class="mcap" aria-live="polite">'+cap+'</div>'+legend+'</div>'
   +'<div class="mside"><h2>'+mesc(m.t)+'</h2><p class="msub">'+mesc(m.sub)+'</p><div class="mbks"><small>'+T("Read")+'</small>'+bks+'</div><ol class="msteps">'+steps+'</ol></div></div>'
   +'<p class="note">'+T("Positions are approximate. Many ancient sites are debated, and hollow markers show where scholars disagree or where the Bible gives no exact place. Coastlines are modern; ancient shorelines differ in places such as the Nile Delta and the head of the Persian Gulf. Check a Bible atlas for detail.")+'</p></article>';
}
function findGroups(bn){
  var gs=[],m={};
  EV.filter(function(e){return e.l==="a"&&e.bk.indexOf(bn)>-1&&FINDLL[e.o.t];}).forEach(function(e){
    var ll=FINDLL[e.o.t],key=Math.round(ll[0]/0.1)+"_"+Math.round(ll[1]/0.1);
    if(!m[key]){m[key]={ll:ll,items:[]};gs.push(m[key]);}
    m[key].items.push(e);
  });
  return gs;
}
function bookMapSection(b){
  var ids=BP[b.n]||[];
  if(!ids.length)return "";
  var view=mviewFor(ids,null,1.6);
  var pins=ids.map(function(id,i){return {id:id,pri:20-i*0.01,data:'data-bpin="'+id+'"'};});
  var groups=findGroups(b.n),inside=0,total=0;
  groups.forEach(function(g,i){
    var ll=g.ll;total+=g.items.length;
    if(ll[1]>=view[0]&&ll[1]<=view[2]&&ll[0]>=view[1]&&ll[0]<=view[3]){inside+=g.items.length;pins.push({ll:ll,name:g.items.length>1?T("{n} finds",{n:g.items.length}):g.items[0].t,find:true,cnt:g.items.length,pri:5,data:'data-bfind="'+i+'"'});}
  });
  var finds=new Array(total);
  var off=finds.length-inside;
  var js=MAPS.filter(function(m){return m.books.indexOf(b.n)>-1;});
  var jl=js.length?'<div class="mjump"><small>'+T("Journey maps")+'</small>'+js.map(function(m){return '<button class="chip" data-mapgo="'+m.id+'">'+mesc(m.t)+'</button>';}).join("")+'</div>':"";
  return '<section class="where"><h2>'+T("Where it happens")+'</h2><p class="sub">'+T("Places named in {b}. Tap a marker to see what it is.",{b:mesc(dn(b.n))})+'</p>'
   +'<figure class="mfig">'+mapSvg({view:view,aspect:1.6,fs:(ids.length>9?9.5:10.5),pxw:mapPxw(),pins:pins,label:T("Map of places in {b}",{b:dn(b.n)})})+'</figure>'
   +'<div class="mcap" id="mcap" aria-live="polite">'+T("Tap a marker for details.")+'</div>'
   +'<div class="mleg"><span><i class="lp"></i>'+T("Place")+'</span>'+(finds.length?'<span><i class="lf"></i>'+T("Archaeological find")+'</span>':"")+'<span><i class="lp hol"></i>'+T("Debated or approximate")+'</span></div>'
   +(off>0?'<p class="mnote">'+plural(off,"{n} find is outside this view. See the finds listed below.","{n} finds are outside this view. See the finds listed below.")+'</p>':"")+jl+'</section>';
}
function mapCaption(el){
  var cap=document.getElementById("mcap");if(!cap)return;
  var id=el.getAttribute("data-bpin");
  if(id){var q=MP[id];var bks=booksAt(id).filter(function(x){return x!==S.book;}).slice(0,6);cap.innerHTML="<b>"+mesc(q[0])+"</b>"+(q[4]?" <em>"+T("(location debated or approximate)")+"</em>":"")+(bks.length?'<span class="mcb">'+T("Also in: ")+bks.map(function(x){return '<button class="chip" data-book="'+mesc(x)+'">'+mesc(dn(x))+'</button>';}).join("")+"</span>":"");return;}
  var fi=el.getAttribute("data-bfind");
  if(fi!==null){var gs=findGroups(S.book),g=gs[Number(fi)];if(g){cap.innerHTML='<b>'+(g.items.length>1?T("{n} archaeological finds here",{n:g.items.length}):T("Archaeological find"))+"</b>"+g.items.map(function(e){return '<span class="mcb"><i class="lf" style="margin-right:6px"></i>'+mesc(e.t)+" — "+mesc(e.d.split(". ")[0])+".</span>";}).join("");}}
}

function render(opts){
  opts=opts||{};
  var wide=S.view==="home"||S.view==="finds"||S.view==="maps";
  $("#main").innerHTML=S.view==="home"?hubView():(S.view==="book"?bookView(byName[S.book]):(S.view==="finds"?findsView():(S.view==="maps"?mapsView():timelineView())));
  $("#shell").classList.toggle("wide",wide);
  $("#top").classList.toggle("nomenu",wide);
  if(S.view==="home"){hubApply();hubCenter(false);}
  renderList();
  document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-view")===S.view));});
  if(opts.top){window.scrollTo(0,0);}
  if(opts.hl){var el=document.querySelector(".card.hl");if(el){el.scrollIntoView({block:"center"});}}
}
function closeDrawer(){$("#side").classList.remove("open");$("#scrim").classList.remove("on");}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-book],[data-view],[data-lane],[data-era],[data-sec],[data-tl],[data-more],[data-clearhl],[data-hub],[data-hubsec],[data-scroll],[data-hubera],[data-fsec],[data-lang],[data-map],[data-step],[data-mapgo],[data-bpin],[data-bfind],#menuBtn,#scrim");
  if(!t)return;
  if(t.hasAttribute("data-lang")){var nl=t.getAttribute("data-lang");if(nl!==LANG){applyLang(nl);render();}return;}
  if(t.hasAttribute("data-map")){S.map=t.getAttribute("data-map");S.mapSel=null;S.mapAnim=true;render();return;}
  if(t.hasAttribute("data-step")){var k=Number(t.getAttribute("data-step"));S.mapSel=S.mapSel===k?null:k;S.mapAnim=false;render();return;}
  if(t.hasAttribute("data-mapgo")){S.view="maps";S.map=t.getAttribute("data-mapgo");S.mapSel=null;S.mapAnim=true;render({top:true});return;}
  if(t.hasAttribute("data-bpin")||t.hasAttribute("data-bfind")){mapCaption(t);return;}
  if(t.hasAttribute("data-fsec")){S.fsec=t.getAttribute("data-fsec");render();return;}
  if(t.hasAttribute("data-hub")){hubSelect(t.getAttribute("data-hub"));return;}
  if(t.hasAttribute("data-hubsec")){var hs=t.getAttribute("data-hubsec");S.hubSec=S.hubSec===hs?null:hs;hubApply();return;}
  if(t.hasAttribute("data-scroll")){var sc=document.getElementById("hubscroll");if(sc){sc.scrollBy({left:Number(t.getAttribute("data-scroll"))*Math.min(720,sc.clientWidth*0.8),behavior:"smooth"});}return;}
  if(t.hasAttribute("data-hubera")){var sc2=document.getElementById("hubscroll");var he=HUBERAS.filter(function(x){return x.id===t.getAttribute("data-hubera");})[0];if(sc2&&he){sc2.scrollTo({left:Math.max(0,he.x-20),behavior:"smooth"});}return;}
  if(t.id==="menuBtn"){$("#side").classList.toggle("open");$("#scrim").classList.toggle("on");return;}
  if(t.id==="scrim"){closeDrawer();return;}
  if(t.hasAttribute("data-book")){S.view="book";S.book=t.getAttribute("data-book");S.more=false;S.open[byName[S.book].s]=true;closeDrawer();render({top:true});return;}
  if(t.hasAttribute("data-view")){S.view=t.getAttribute("data-view");if(S.view==="book"){S.hl=null;}if(S.view==="maps"){S.mapAnim=true;}closeDrawer();render({top:true});return;}
  if(t.hasAttribute("data-lane")){S.lane=t.getAttribute("data-lane");render();return;}
  if(t.hasAttribute("data-era")){var el=document.getElementById("era-"+t.getAttribute("data-era"));if(el)el.scrollIntoView({block:"start"});return;}
  if(t.hasAttribute("data-sec")){var n=t.getAttribute("data-sec");var cur=t.parentNode.classList.contains("open");S.open[n]=!cur;renderList();return;}
  if(t.hasAttribute("data-tl")){S.hl=t.getAttribute("data-tl");S.view="timeline";S.lane="both";render({hl:true});return;}
  if(t.hasAttribute("data-more")){S.more=true;render();return;}
  if(t.hasAttribute("data-clearhl")){S.hl=null;render();return;}
});
document.addEventListener("keydown",function(ev){if((ev.key==="Enter"||ev.key===" ")&&ev.target&&ev.target.classList&&ev.target.classList.contains("mpin")){ev.preventDefault();ev.target.dispatchEvent(new MouseEvent("click",{bubbles:true}));}});
$("#q").addEventListener("input",function(e){S.q=e.target.value;renderList();});

window.__app={applyLang:applyLang,T:T,dn:dn,MAPS:MAPS,BP:BP,MP:MP,mapsView:mapsView,bookMapSection:bookMapSection,BOOKS:BOOKS,EV:EV,bookView:bookView,timelineView:timelineView,findsView:findsView,hubView:hubView,hubDetail:hubDetail,hubLayout:hubLayout,byName:byName,S:S};
S.open["Law"]=true;
applyLang(LANG);
render();
})();
</script>
